name: Build SPM deep tender intelligence v1

on:
  push:
    branches: [tender-harvest-relay-20260812]
    paths: ['.github/workflows/tender-spm-deep-intelligence-v1.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tender-spm-deep-intelligence-v1
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tender-harvest-relay-20260812
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install analytics runtime
        run: python -m pip install --disable-pip-version-check -q duckdb

      - name: Apply audited builder fixes and compile
        run: |
          python tools/patch_spm_deep_intelligence_v1.py
          python -m py_compile tools/spm_niche_rules.py tools/build_spm_deep_intelligence_v1.py

      - name: Download authoritative Core v4 and USA evidence lane
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p core usa intel
          for a in historical_tenders.parquet awards.parquet award_suppliers.parquet data_quality.json; do
            gh release download tender-normalized-global-core-v4 --pattern "$a" --dir core --clobber
          done
          gh release download tender-normalized-usa-awards-v1 --pattern market_rank.csv --pattern repeat_buyers.csv --dir usa --clobber
          python - <<'PY'
          import json
          q=json.load(open('core/data_quality.json'))
          assert q['status']=='PASS',q
          counts=q.get('counts',q.get('counts_notice_first',{}))
          assert counts.get('historical_tenders')==2250547,(counts,q)
          assert counts.get('awards')==4286784,(counts,q)
          assert counts.get('award_suppliers')==3937663,(counts,q)
          print('CORE_V4_ANALYSIS_GATE_PASS',counts)
          PY

      - name: Full-corpus SPM analysis
        run: |
          python tools/build_spm_deep_intelligence_v1.py \
            --core core \
            --usa-rank usa/market_rank.csv \
            --usa-repeat usa/repeat_buyers.csv \
            --out intel

      - name: Validate analytical outputs
        run: |
          python - <<'PY'
          import json,csv,glob,os
          q=json.load(open('intel/data_quality.json'))
          assert q['status']=='PASS',q
          assert q['source_core_tenders']==2250547,q
          with open('intel/spm_opportunity_matrix.csv',newline='',encoding='utf-8') as f:
            n=sum(1 for _ in csv.reader(f))-1
          assert n>=10,n
          for required in [
            'top20_easiest_money.csv','top20_expected_profit.csv','top20_ai_leverage.csv','top20_middleman.csv',
            'top50_spm_opportunities.csv','hidden_gem_candidates.csv','top_recurring_buyers_by_niche.csv',
            'top_winners_by_niche.csv','price_distribution_by_niche_currency.csv','representative_tenders_top_niches.csv',
            'entry_requirement_signal_mentions.csv','seasonality_by_niche.csv','live_scoring_spec.json','QUANTITATIVE_READOUT.md']:
            assert os.path.exists('intel/'+required),required
          print('SPM_INTELLIGENCE_QA_PASS',q['spm_regex_matched_tenders'],q['spm_match_rate_pct'])
          PY

      - name: Publish SPM intelligence release
        shell: bash
        run: |
          set -euo pipefail
          TAG='tender-spm-deep-intelligence-v1'
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title 'Public Tender Intelligence — SPM Deep Intelligence v1' \
              --notes 'DERIVED analytical layer over validated Global Core v4. SPM scoring is explicitly 70% empirical market evidence and 30% auditable business-fit heuristics. Currency isolation, UNKNOWN preservation, bidder-coverage neutralization, consortium fractionalization and award-first USA separation remain enforced.' \
              --target tender-harvest-relay-20260812
          fi
          find intel -maxdepth 1 -type f -print0 | while IFS= read -r -d '' f; do gh release upload "$TAG" "$f" --clobber; done
          gh release view "$TAG" --json tagName,url,assets

      - name: Persist decision-readable outputs in repo
        shell: bash
        run: |
          set -euo pipefail
          DEST='tender_pipeline/analysis/spm_deep_v1'
          mkdir -p "$DEST"
          for f in \
            QUANTITATIVE_READOUT.md data_quality.json live_scoring_spec.json schema_profile.json \
            spm_opportunity_matrix.csv top50_spm_opportunities.csv top20_easiest_money.csv top20_expected_profit.csv \
            top20_ai_leverage.csv top20_middleman.csv hidden_gem_candidates.csv country_spm_fit.csv \
            price_distribution_by_niche_currency.csv entry_requirement_signal_mentions.csv seasonality_by_niche.csv \
            buyer_niche_monitor_rank.csv top_winners_by_niche.csv representative_tenders_top_niches.csv \
            unmatched_high_lean_title_terms.csv; do
            [ -f "intel/$f" ] && cp "intel/$f" "$DEST/$f"
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DEST"
          if ! git diff --cached --quiet; then
            git commit -m 'Persist SPM deep tender intelligence v1 outputs'
            git push origin HEAD:tender-harvest-relay-20260812
          fi
