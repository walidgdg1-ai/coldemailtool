name: Prepare durable tender country releases

on:
  push:
    branches: [tender-harvest-relay-20260812]
    paths: ['.github/workflows/tender-prepare-country-releases.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create durable releases on branch target
        shell: bash
        run: |
          set -euo pipefail
          create_release() {
            tag="$1"; title="$2"; notes="$3"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "EXISTS $tag"
            else
              gh release create "$tag" \
                --title "$title" \
                --notes "$notes" \
                --target tender-harvest-relay-20260812
              echo "CREATED $tag"
            fi
          }
          create_release tender-usa-awards-qa-v1 \
            'USAspending federal awards 36-month QA v1' \
            'Pre-validation QA for the canonical 2023-08-01 through 2026-07-31 USAspending award-first warehouse.'
          create_release tender-normalized-usa-awards-v1 \
            'Public Tender Normalized — USA federal awards v1' \
            'Canonical award-first USAspending federal contract warehouse for 2023-08-01 through 2026-07-31. Original tender notices are not asserted.'
          create_release tender-germany-qa-v1 \
            'Germany eForms normalization QA v1' \
            'Pre-validation QA for canonical Germany eForms normalization.'
          create_release tender-normalized-germany-v1 \
            'Public Tender Normalized — Germany eForms v1' \
            'Canonical relational German eForms warehouse for 2023-08-01 through 2026-07-31.'
      - name: Read back all releases
        run: |
          for tag in tender-usa-awards-qa-v1 tender-normalized-usa-awards-v1 tender-germany-qa-v1 tender-normalized-germany-v1; do
            gh release view "$tag" --json tagName,url
          done
