name: Diagnose Germany normalizer on one month
on:
  push:
    branches: [tender-harvest-relay-20260812]
    paths: ['.github/workflows/germany-normalizer-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check -q pandas
      - name: Download one representative Germany month
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p raw/germany
          gh release download tender-raw-germany-v1 --pattern 'germany_2026-07.zip' --dir raw/germany --clobber
      - name: Run normalizer and capture exact traceback
        id: smoke
        shell: bash
        run: |
          set +e
          python tools/patch_germany_normalizer_runtime.py
          python tools/tender_normalize_germany.py --raw-dir raw/germany --out normalized/germany-smoke --start 2026-07-01 --end 2026-07-31 > germany_smoke.log 2>&1
          rc=$?
          cat germany_smoke.log
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          tail -n 500 germany_smoke.log > germany_smoke_tail.log
          exit 0
      - name: Publish temporary private diagnostic issue when parser fails
        if: steps.smoke.outputs.exit_code != '0'
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          {
            echo 'Temporary automated diagnostic. Safe to close after repair.'
            echo
            echo '```text'
            cat germany_smoke_tail.log
            echo '```'
          } > issue_body.md
          gh issue create --title "TEMP Germany normalizer traceback $GITHUB_RUN_ID" --body-file issue_body.md
      - name: Fail if parser failed
        run: test '${{ steps.smoke.outputs.exit_code }}' = '0'
