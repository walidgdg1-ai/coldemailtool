name: Hosted Runner Capacity Diagnostic

on:
  push:
    branches:
      - diag/hosted-runner-capacity
    paths:
      - '.github/workflows/runner-capacity-diagnostic.yml'

jobs:
  probe:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        os: [ubuntu-24.04-arm, ubuntu-22.04-arm, windows-11-arm, ubuntu-slim]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 3
    steps:
      - name: Probe runner assignment
        shell: bash
        run: |
          echo "os=${{ matrix.os }}"
          echo "runner=${{ runner.name }}"
          date -u
          sleep 20
