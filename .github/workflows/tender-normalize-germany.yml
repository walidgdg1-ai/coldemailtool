name: Normalize Germany eForms public procurement
on:
  push:
    branches: [tender-harvest-relay-20260812]
    paths:
      - '.github/workflows/tender-normalize-germany.yml'
      - 'tools/tender_normalize_germany.py'
      - 'tools/patch_germany_normalizer_runtime.py'
  workflow_dispatch:
permissions: {contents: write}
concurrency:
  group: tender-normalize-germany-v1
  cancel-in-progress: false
jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q pandas
      - name: Download official Germany monthly eForms exports
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir -p raw/germany
          gh release download tender-raw-germany-v1 --pattern 'germany_*.zip' --dir raw/germany --clobber
          echo "assets=$(find raw/germany -name 'germany_*.zip' | wc -l)"
          du -sh raw/germany
          test "$(find raw/germany -name 'germany_*.zip' | wc -l)" -ge 30
      - name: Apply audited runtime complexity patch
        run: python tools/patch_germany_normalizer_runtime.py
      - name: Normalize eForms to canonical relational warehouse
        run: python tools/tender_normalize_germany.py --raw-dir raw/germany --out normalized/germany --start 2023-08-01 --end 2026-07-31
      - name: Persist pre-validation QA
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          TAG='tender-germany-qa-v1'
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title 'Germany eForms normalization QA v1' --notes 'Pre-validation QA for canonical Germany normalization.' --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" normalized/germany/data_quality.json normalized/germany/run_manifest.json --clobber
      - name: Validate canonical integrity
        run: |
          python - <<'PY'
          import json,pandas as pd
          q=json.load(open('normalized/germany/data_quality.json'))
          print(json.dumps(q,indent=2,ensure_ascii=False))
          assert q['normalized_tenders'] > 10000, q
          assert q['award_groups'] > 1000, q
          assert q['unique_buyers'] > 500, q
          assert q['parse_errors']/max(q['raw_xml'],1) < .01, q
          assert all(q['integrity'].values()), q['integrity']
          t=pd.read_csv('normalized/germany/historical_tenders.csv.gz')
          a=pd.read_csv('normalized/germany/awards.csv.gz')
          b=pd.read_csv('normalized/germany/award_suppliers.csv.gz')
          assert t.Historical_Tender_ID.is_unique
          assert a.Award_ID.is_unique
          if len(b):
            multi=set(a.loc[a.Supplier_Count.fillna(0)>1,'Award_ID'])
            assert b.loc[b.Award_ID.isin(multi),'Award_Value_Allocated'].isna().all()
          print('GERMANY_CANONICAL_VALIDATION_PASS')
          PY
      - name: Publish normalized Germany warehouse
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          TAG='tender-normalized-germany-v1'
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title 'Public Tender Normalized — Germany eForms v1' --notes 'Canonical relational German eForms warehouse for 2023-08-01 through 2026-07-31, with lot-result awards and official received-tender counts where published.' --target "$GITHUB_SHA"
          fi
          find normalized/germany -type f -print0 | while IFS= read -r -d '' f; do gh release upload "$TAG" "$f" --clobber; done
          gh release view "$TAG" --json tagName,url,assets
