name: Capture Belgium public BDA pagination contract

on:
  push:
    branches: [tender-harvest-relay-20260812]
    paths: ['.github/workflows/belgium-ui-pagination-contract-probe.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install anonymous Chromium
        run: |
          python -m pip install --disable-pip-version-check -q playwright
          python -m playwright install --with-deps chromium >/dev/null

      - name: Drive only visible public UI and capture SEA request bodies
        run: |
          python - <<'PY'
          import asyncio,json,re
          from pathlib import Path
          from playwright.async_api import async_playwright

          async def main():
            report={'url':'https://www.publicprocurement.be/bda','requests':[],'controls':{},'actions':[],'errors':[]}
            async with async_playwright() as p:
              browser=await p.chromium.launch(headless=True)
              page=await browser.new_page(locale='en-GB',viewport={'width':1440,'height':1100})

              def on_request(req):
                if '/api/sea/search/publications' in req.url.lower():
                  report['requests'].append({'method':req.method,'url':req.url,'post_data':req.post_data})
              page.on('request',on_request)

              await page.goto(report['url'],wait_until='domcontentloaded',timeout=90000)
              await page.wait_for_timeout(7000)

              # Capture public controls only: labels/text/types, never cookies/storage/headers.
              report['controls']['buttons']=await page.locator('button').evaluate_all("els => els.slice(0,150).map((e,i)=>({i,text:(e.innerText||'').trim(),aria:e.getAttribute('aria-label'),title:e.getAttribute('title'),disabled:e.disabled}))")
              report['controls']['inputs']=await page.locator('input').evaluate_all("els => els.slice(0,100).map((e,i)=>({i,type:e.type,name:e.name,placeholder:e.placeholder,aria:e.getAttribute('aria-label'),value:e.value}))")
              report['controls']['selects']=await page.locator('select').evaluate_all("els => els.slice(0,50).map((e,i)=>({i,name:e.name,aria:e.getAttribute('aria-label'),value:e.value,options:[...e.options].map(o=>({text:o.text,value:o.value}))}))")
              report['controls']['links']=await page.locator('a').evaluate_all("els => els.slice(0,200).map((e,i)=>({i,text:(e.innerText||'').trim(),href:e.getAttribute('href'),aria:e.getAttribute('aria-label'),title:e.getAttribute('title')}))")
              initial=len(report['requests'])
              report['actions'].append({'initial_request_count':initial})

              # Try a next-page control exposed by the public UI. Prefer semantic names, then a visible page-2 button.
              clicked=False
              candidates=[]
              for pat in [r'next',r'suivant',r'volgende',r'weiter']:
                candidates.append(page.get_by_role('button',name=re.compile(pat,re.I)))
                candidates.append(page.get_by_role('link',name=re.compile(pat,re.I)))
              for loc in candidates:
                try:
                  if await loc.count() and await loc.first.is_visible() and await loc.first.is_enabled():
                    txt=(await loc.first.inner_text()) if await loc.first.inner_text() is not None else ''
                    await loc.first.click(timeout=5000);clicked=True;report['actions'].append({'clicked':'semantic-next','text':txt});break
                except Exception as e: report['errors'].append('semantic-next '+repr(e))
              if not clicked:
                for role in ['button','link']:
                  try:
                    loc=page.get_by_role(role,name=re.compile(r'^\s*2\s*$'))
                    if await loc.count() and await loc.first.is_visible():
                      await loc.first.click(timeout=5000);clicked=True;report['actions'].append({'clicked':'page-2','role':role});break
                  except Exception as e: report['errors'].append('page2 '+repr(e))
              if clicked: await page.wait_for_timeout(7000)
              report['actions'].append({'after_page_action_request_count':len(report['requests'])})

              # Try the largest visible/selectable page-size option only via UI.
              changed=False
              for i in range(await page.locator('select').count()):
                sel=page.locator('select').nth(i)
                try:
                  opts=await sel.locator('option').evaluate_all("els=>els.map(o=>({text:o.text,value:o.value}))")
                  nums=[]
                  for o in opts:
                    m=re.search(r'\d+',str(o.get('text','')))
                    if m: nums.append((int(m.group()),o.get('value')))
                  if nums and max(x[0] for x in nums)>=25:
                    best=max(nums)
                    await sel.select_option(value=str(best[1]));changed=True;report['actions'].append({'changed_page_size':best[0],'select_index':i});break
                except Exception as e: report['errors'].append('page-size '+repr(e))
              if changed: await page.wait_for_timeout(7000)
              report['actions'].append({'after_page_size_request_count':len(report['requests'])})

              await browser.close()
            report['unique_request_bodies']=[]
            seen=set()
            for r in report['requests']:
              b=r.get('post_data') or ''
              if b not in seen:seen.add(b);report['unique_request_bodies'].append(b)
            report['safety']='Anonymous public UI interactions only. No request headers, cookies, localStorage, auth tokens or browser state persisted.'
            Path('belgium-ui-pagination-contract.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
            print(json.dumps(report,ensure_ascii=False,indent=2)[:50000])
            if len(report['unique_request_bodies'])<2:
              raise SystemExit('Pagination/page-size did not produce a second distinct app-generated search body')

          asyncio.run(main())
          PY

      - name: Persist non-secret public UI contract report
        if: always()
        run: |
          set -euo pipefail
          TAG='tender-belgium-ui-pagination-probe-v1'
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title 'Belgium public BDA UI pagination contract' --notes 'Anonymous public UI diagnostic. No headers, cookies, tokens, credentials or browser state included.' --target tender-harvest-relay-20260812
          fi
          test -f belgium-ui-pagination-contract.json && gh release upload "$TAG" belgium-ui-pagination-contract.json --clobber || true
