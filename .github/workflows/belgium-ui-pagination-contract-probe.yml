name: Belgium public BDA recent-history warehouse

on:
  push:
    branches: [tender-harvest-relay-20260812]
    paths:
      - '.github/workflows/belgium-ui-pagination-contract-probe.yml'
      - 'tools/belgium_public_harvest.py'
      - 'tools/tender_normalize_belgium.py'
      - 'tools/patch_belgium_normalizer_runtime.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tender-belgium-public-36m-v1
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tender-harvest-relay-20260812
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}

      - name: Install anonymous public-browser dependency
        run: |
          python -m pip install --disable-pip-version-check -q playwright
          python -m playwright install --with-deps chromium >/dev/null

      - name: Prepare durable raw release and resume checkpoint
        shell: bash
        run: |
          set -euo pipefail
          TAG='tender-raw-belgium-public-v1'
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title 'Belgium public BDA recent-history raw v1' \
              --notes 'Anonymous public Bulletin of Tenders UI responses, checkpointed in 100-page chunks. No auth headers, cookies, browser storage, tokens or credentials are captured or persisted. Canonical window: 2023-08-01 through 2026-07-31.' \
              --target tender-harvest-relay-20260812
          fi
          mkdir -p raw/belgium
          gh release download "$TAG" --pattern 'belgium-public-checkpoint.json' --dir raw/belgium --clobber || true

      - name: Harvest public BDA chronologically with durable checkpoints
        shell: bash
        run: |
          set -uo pipefail
          COMPLETE=no
          if [ -f raw/belgium/belgium-public-checkpoint.json ]; then
            COMPLETE=$(python - <<'PY'
          import json
          q=json.load(open('raw/belgium/belgium-public-checkpoint.json'))
          print('yes' if q.get('status')=='COMPLETE' else 'no')
          PY
          )
          fi
          if [ "$COMPLETE" = yes ]; then
            echo 'BELGIUM_RAW_ALREADY_COMPLETE_SKIP_HARVEST'
          else
            SUCCESS=no
            for ATTEMPT in 1 2 3 4 5 6; do
              echo "BELGIUM_HARVEST_PROCESS_ATTEMPT=$ATTEMPT"
              if python tools/belgium_public_harvest.py \
                --out raw/belgium \
                --release-tag tender-raw-belgium-public-v1 \
                --start 2023-08-01 \
                --end 2026-07-31 \
                --chunk-pages 100 \
                --delay-ms 100; then
                SUCCESS=yes
                break
              fi
              echo "BELGIUM_HARVEST_PROCESS_RESTART=$ATTEMPT"
              sleep $(( ATTEMPT * 15 ))
            done
            test "$SUCCESS" = yes
          fi

      - name: Read back complete raw census
        shell: bash
        run: |
          set -euo pipefail
          rm -rf raw_readback && mkdir raw_readback
          gh release download tender-raw-belgium-public-v1 \
            --pattern 'belgium-public-checkpoint.json' \
            --pattern 'belgium-public-summary.json' \
            --dir raw_readback --clobber
          python - <<'PY'
          import json
          q=json.load(open('raw_readback/belgium-public-checkpoint.json'))
          s=json.load(open('raw_readback/belgium-public-summary.json'))
          print(json.dumps(q,indent=2))
          assert q['status']=='COMPLETE',q
          assert q['completed_pages']>100,q
          assert q['records_persisted']>10000,q
          assert q['page_size']==25,q
          assert s['status']=='RAW_COMPLETE',s
          assert s['records_persisted']==q['records_persisted'],(s,q)
          print('BELGIUM_RAW_READBACK_PASS',q['completed_pages'],q['records_persisted'],q.get('oldest_seen'))
          PY

      - name: Download persisted raw chunks for normalization
        shell: bash
        run: |
          set -euo pipefail
          rm -rf raw_all && mkdir raw_all
          gh release download tender-raw-belgium-public-v1 \
            --pattern 'belgium-public-pages-*.jsonl.gz' \
            --dir raw_all --clobber
          echo "Belgium raw chunks: $(find raw_all -type f -name '*.jsonl.gz' | wc -l)"

      - name: Apply exact observed BOSA public metadata mapping
        run: python tools/patch_belgium_normalizer_runtime.py

      - name: Normalize conservative notice-first Belgium warehouse
        run: |
          set -euo pipefail
          python tools/tender_normalize_belgium.py \
            --raw-dir raw_all \
            --out normalized/belgium \
            --start 2023-08-01 \
            --end 2026-07-31
          cat normalized/belgium/data_quality.json

      - name: Validate Belgium canonical warehouse
        run: |
          python - <<'PY'
          import json
          q=json.load(open('normalized/belgium/data_quality.json'))
          assert q['status']=='PASS',q
          assert q['canonical_tenders']>10000,q
          assert q['publication_events']>=q['canonical_tenders'],q
          assert all(q['integrity'].values()),q
          assert q['award_facts_status']=='NOT_ASSERTED_FROM_SEARCH_SUMMARY',q
          assert q.get('buyer_name_coverage_pct',0)>80,q
          assert q.get('title_coverage_pct',0)>80,q
          assert q.get('procedure_type_coverage_pct',0)>50,q
          print('BELGIUM_CANONICAL_PASS',q['canonical_tenders'],q['publication_events'],q['exact_ted_reference_links'],q['buyer_name_coverage_pct'],q['title_coverage_pct'],q['procedure_type_coverage_pct'])
          PY

      - name: Publish and read back Belgium canonical warehouse
        shell: bash
        run: |
          set -euo pipefail
          TAG='tender-normalized-belgium-v1'
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title 'Belgium public BDA canonical recent-history warehouse v1' \
              --notes 'Conservative notice-first normalization of anonymous public Belgium BDA publication data for 2023-08-01 through 2026-07-31. Exact TED source references are retained for overlap-aware joins; supplier/value award facts are not fabricated from search summaries.' \
              --target tender-harvest-relay-20260812
          fi
          find normalized/belgium -maxdepth 1 -type f -print0 | while IFS= read -r -d '' f; do
            gh release upload "$TAG" "$f" --clobber
          done
          rm -rf final_rb && mkdir final_rb
          gh release download "$TAG" --pattern data_quality.json --pattern run_manifest.json --dir final_rb --clobber
          python - <<'PY'
          import json
          q=json.load(open('final_rb/data_quality.json'))
          assert q['status']=='PASS',q
          assert all(q['integrity'].values()),q
          assert q.get('buyer_name_coverage_pct',0)>80,q
          assert q.get('title_coverage_pct',0)>80,q
          print('BELGIUM_FINAL_RELEASE_READBACK_PASS',q['canonical_tenders'],q['publication_events'],q['exact_ted_reference_links'])
          PY
