name: Tender relay release probe

on:
  push:
    branches: [tender-harvest-relay-20260812]
    paths: ['.github/workflows/tender-harvest-relay.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Publish release probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=tender-relay-probe-20260812
          printf 'tender-release-relay-v1\n' > /tmp/tender-release-probe.txt
          sha256sum /tmp/tender-release-probe.txt
          gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" /tmp/tender-release-probe.txt --title 'Tender relay probe' --notes 'Temporary transport probe for public tender datasets.' --target "$GITHUB_SHA"
          gh release view "$TAG" --json id,tagName,url,assets
