name: Tender endpoint probes

on:
  push:
    branches: [tender-harvest-relay-20260812]
    paths:
      - '.github/workflows/tender-harvest-relay.yml'
      - 'tools/tender_endpoint_probe.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q requests
      - run: python tools/tender_endpoint_probe.py
