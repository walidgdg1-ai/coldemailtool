name: Tender relay file-host probe

on:
  push:
    branches: [tender-harvest-relay-20260812]
    paths: ['.github/workflows/tender-harvest-relay.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Upload and verify public-data probe
        run: |
          set -euo pipefail
          printf 'tender-relay-public-data-probe-v1\n' > /tmp/tender-probe.txt
          WANT=$(sha256sum /tmp/tender-probe.txt | cut -d' ' -f1)
          URL=$(curl --fail-with-body -sS -F 'reqtype=fileupload' -F 'fileToUpload=@/tmp/tender-probe.txt' https://catbox.moe/user/api.php)
          echo "FILE_URL=$URL"
          curl --fail-with-body -sSL "$URL" -o /tmp/back.txt
          GOT=$(sha256sum /tmp/back.txt | cut -d' ' -f1)
          echo "WANT_SHA256=$WANT"
          echo "GOT_SHA256=$GOT"
          test "$WANT" = "$GOT"
