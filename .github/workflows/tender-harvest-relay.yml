name: Tender relay transport test

on:
  push:
    branches:
      - tender-harvest-relay-20260812
    paths:
      - '.github/workflows/tender-harvest-relay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transport-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Make probe
        run: |
          printf 'public-tender-relay %s\n' "$(date -u +%FT%TZ)" > /tmp/tender-relay-probe.txt
          sha256sum /tmp/tender-relay-probe.txt
      - name: Guest-upload probe to Gofile
        run: |
          set -o pipefail
          RESPONSE=$(curl --fail-with-body -sS -F 'file=@/tmp/tender-relay-probe.txt' https://upload.gofile.io/uploadfile)
          echo "GOFILE_RESPONSE=$RESPONSE"
