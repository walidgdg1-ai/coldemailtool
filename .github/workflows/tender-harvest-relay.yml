name: Public tender raw archive v1

on:
  push:
    branches: [tender-harvest-relay-20260812]
    paths:
      - '.github/workflows/tender-harvest-relay.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  harvest:
    name: ${{ matrix.source }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        source:
          - canada
          - france
          - germany
          - quebec
          - ted_2023
          - ted_2024
          - ted_2025
          - ted_2026
          - uk_2023
          - uk_2024
          - uk_2025
          - uk_2026
          - usa_2023_08
          - usa_2023_09
          - usa_2023_10
          - usa_2023_11
          - usa_2023_12
          - usa_2024_01
          - usa_2024_02
          - usa_2024_03
          - usa_2024_04
          - usa_2024_05
          - usa_2024_06
          - usa_2024_07
          - usa_2024_08
          - usa_2024_09
          - usa_2024_10
          - usa_2024_11
          - usa_2024_12
          - usa_2025_01
          - usa_2025_02
          - usa_2025_03
          - usa_2025_04
          - usa_2025_05
          - usa_2025_06
          - usa_2025_07
          - usa_2025_08
          - usa_2025_09
          - usa_2025_10
          - usa_2025_11
          - usa_2025_12
          - usa_2026_01
          - usa_2026_02
          - usa_2026_03
          - usa_2026_04
          - usa_2026_05
          - usa_2026_06
          - usa_2026_07
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --disable-pip-version-check -q requests
      - name: Harvest official source
        env:
          TENDER_OUT: relay_out/${{ matrix.source }}
        run: python tools/tender_harvest_prod.py '${{ matrix.source }}'
      - name: Inventory
        if: always()
        run: |
          du -sh relay_out/${{ matrix.source }} || true
          find relay_out/${{ matrix.source }} -type f -printf '%s\t%p\n' 2>/dev/null | sort -nr | head -60 || true
      - name: Persist raw files as private GitHub Release assets
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ matrix.source }}
        run: |
          set -euo pipefail
          TAG="tender-raw-${SOURCE}-v1"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Public Tender Raw — ${SOURCE}" --notes "Official public-procurement raw acquisition. Window: 2023-08-01 through 2026-07-31 where applicable. Generated by Public Tender Intelligence relay; source URLs, sizes and SHA-256 are recorded in _manifest.jsonl." --target "$GITHUB_SHA"
          fi
          while IFS= read -r -d '' f; do
            echo "Uploading $f"
            gh release upload "$TAG" "$f" --clobber
          done < <(find relay_out/${SOURCE} -type f -print0)
          gh release view "$TAG" --json tagName,url,assets
