name: Audit global core fact schemas
on:
  push:
    branches: [tender-harvest-relay-20260812]
    paths: ['.github/workflows/tender-global-core-fact-schema-audit.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env: {GH_TOKEN: '${{ github.token }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check -q duckdb
      - name: Download core fact parquets
        run: |
          mkdir -p core
          for a in historical_tenders.parquet awards.parquet award_suppliers.parquet; do gh release download tender-normalized-global-core-v1 --pattern "$a" --dir core --clobber; done
      - name: Print schemas and representative rows
        run: |
          python - <<'PY'
          import duckdb,json
          con=duckdb.connect();out={}
          for name in ['historical_tenders','awards','award_suppliers']:
            p=f'core/{name}.parquet'
            schema=[{'name':r[0],'type':r[1]} for r in con.execute(f"DESCRIBE SELECT * FROM read_parquet('{p}')").fetchall()]
            cur=con.execute(f"SELECT * FROM read_parquet('{p}') LIMIT 3");cols=[d[0] for d in cur.description];rows=[dict(zip(cols,r)) for r in cur.fetchall()]
            out[name]={'schema':schema,'rows':rows}
          print(json.dumps(out,indent=2,default=str,ensure_ascii=False))
          PY
