name: SPM open-world discovery v2

on:
  push:
    branches: [tender-harvest-relay-20260812]
    paths:
      - '.github/workflows/tender-spm-open-world-discovery-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tender-spm-open-world-discovery-v2
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tender-harvest-relay-20260812
          fetch-depth: 0
      - name: Free runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /opt/microsoft /usr/local/share/powershell || true
          sudo apt-get clean || true
          df -h /
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check -q duckdb
      - name: Download validated inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p core prior out
          gh release download tender-normalized-global-core-v4 --pattern historical_tenders.parquet --pattern data_quality.json --dir core --clobber
          gh release download tender-spm-tender-discovery-v1 --pattern matched_tenders.parquet --dir prior --clobber
          python - <<'PY'
          import json
          q=json.load(open('core/data_quality.json'));c=q.get('counts',q.get('counts_notice_first',{}))
          assert q['status']=='PASS' and c.get('historical_tenders')==2250547,(q,c)
          print('OPEN_WORLD_V2_INPUT_GATE_PASS',c)
          PY
      - name: Global multi-word residual discovery
        run: |
          python tools/build_spm_open_world_discovery_v2.py --core core --matched prior/matched_tenders.parquet --out out
      - name: Validate outputs
        run: |
          python - <<'PY'
          import json,os,csv
          q=json.load(open('out/data_quality.json'))
          assert q['status']=='PASS',q
          assert q['open_world_unmatched_tenders']>2000000,q
          assert q['multiword_phrases']>1000,q
          assert q['actionable_candidates']>100,q
          for f in ['global_category_cohorts.csv','multiword_title_phrases.csv','top_actionable_open_world_candidates.csv','OPEN_WORLD_V2_READOUT.md']:
            assert os.path.exists('out/'+f),f
          print('OPEN_WORLD_V2_QA_PASS',q)
          PY
      - name: Publish derived release
        shell: bash
        run: |
          set -euo pipefail
          TAG='tender-spm-open-world-discovery-v2'
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title 'Public Tender Intelligence — SPM Open-World Discovery v2' --notes 'Global cross-source residual discovery with 2-gram/3-gram phrase mining. No DCE dependency.' --target tender-harvest-relay-20260812
          fi
          for f in out/*.csv out/*.json out/*.md; do gh release upload "$TAG" "$f" --clobber; done
      - name: Persist readable outputs
        shell: bash
        run: |
          set -euo pipefail
          DEST='tender_pipeline/analysis/spm_open_world_discovery_v2';mkdir -p "$DEST"
          cp out/OPEN_WORLD_V2_READOUT.md out/data_quality.json out/global_category_cohorts.csv out/multiword_title_phrases.csv out/top_actionable_open_world_candidates.csv "$DEST/"
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DEST"
          if ! git diff --cached --quiet; then
            git commit -m 'Persist SPM open-world discovery v2 outputs'
            git pull --rebase origin tender-harvest-relay-20260812
            git push origin HEAD:tender-harvest-relay-20260812
          fi
