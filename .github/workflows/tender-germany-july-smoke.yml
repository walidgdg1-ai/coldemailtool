name: Germany eForms July 2026 smoke

on:
  push:
    branches: [tender-harvest-relay-20260812]
    paths:
      - '.github/workflows/tender-germany-july-smoke.yml'
      - 'tools/patch_germany_normalizer_runtime.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tender-germany-july-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check -q pandas
      - name: Download July 2026 official German export
        run: |
          mkdir -p raw/germany
          gh release download tender-raw-germany-v1 --pattern 'germany_2026-07.zip' --dir raw/germany --clobber
      - name: Apply audited runtime patch
        run: python tools/patch_germany_normalizer_runtime.py
      - name: Normalize July smoke
        run: |
          python tools/tender_normalize_germany.py \
            --raw-dir raw/germany \
            --out smoke/germany \
            --start 2026-07-01 \
            --end 2026-07-31
      - name: Enforce smoke quality
        run: |
          python - <<'PY'
          import json
          q=json.load(open('smoke/germany/data_quality.json'))
          print(json.dumps(q,indent=2))
          assert q.get('raw_xml',0)>20000,q
          assert q.get('unique_source_notices',0)>20000,q
          assert q.get('out_of_window',0) < q['raw_xml']*0.06,q
          assert q.get('normalized_tenders',0)>20000,q
          assert q.get('award_groups',0)>5000,q
          assert q.get('award_supplier_links',0)>5000,q
          assert q.get('publication_date_coverage_pct',0)>99,q
          assert q.get('award_value_coverage_pct',0)>50,q
          assert q.get('bidder_count_coverage_pct',0)>70,q
          assert all(q.get('integrity',{}).values()),q
          print('GERMANY_JULY_SMOKE_PASS',q['normalized_tenders'],q['award_groups'],q['bidder_count_coverage_pct'])
          PY
