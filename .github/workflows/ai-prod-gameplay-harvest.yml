name: AI Prod Gameplay Screenshot Harvest

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harvest:
    name: HD priority hybrid extra game ${{ matrix.game_index }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        game_index: [9, 10, 11, 12]

    steps:
      - name: Check out isolated branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install harvesting dependencies
        run: python -m pip install --disable-pip-version-check --upgrade "yt-dlp[default,curl-cffi]" requests beautifulsoup4 pillow opencv-python-headless imagehash numpy
      - name: Harvest gallery-priority gameplay frames
        id: harvest
        continue-on-error: true
        env:
          GAME_INDEX: ${{ matrix.game_index }}
          TARGET_PER_GAME: "15"
          MIN_NATIVE_W: "900"
          MIN_NATIVE_H: "500"
          FALLBACK_W: "600"
          FALLBACK_H: "330"
          YT_MAX_VIDEOS: "36"
        run: |
          set -o pipefail
          python tools/run_hd_hybrid_priority.py 2>&1 | tee "hd_harvest_${{ matrix.game_index }}.log"
      - name: Record game outcome
        if: always()
        run: |
          echo "Harvest outcome: ${{ steps.harvest.outcome }}" | tee -a "hd_harvest_${{ matrix.game_index }}.log"
          find HD_EXTRA_REFERENCE_BANK -maxdepth 4 -type f 2>/dev/null | sort | tee -a "hd_harvest_${{ matrix.game_index }}.log" || true
      - name: Upload game result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hd-extra-game-${{ matrix.game_index }}
          path: |
            HD_EXTRA_REFERENCE_BANK/
            hd_harvest_${{ matrix.game_index }}.log
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14

  package:
    name: Package HD batch
    if: always()
    needs: harvest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out packager
        uses: actions/checkout@v4
      - name: Download all per-game artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: hd-extra-game-*
          path: parts
          merge-multiple: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packaging dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Assemble and validate package
        continue-on-error: true
        run: |
          set -o pipefail
          python tools/package_hd_hybrid_results.py parts FINAL_HD_EXTRA_PACKAGE 2>&1 | tee package.log
      - name: Upload batch package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AI_PROD_HD_EXTRA_BATCH_09_12
          path: |
            AI_PROD_HD_EXTRA_15_PER_GAME.zip
            FINAL_HD_EXTRA_PACKAGE/
            package.log
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
