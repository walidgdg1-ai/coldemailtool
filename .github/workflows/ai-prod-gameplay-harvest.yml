name: AI Prod Gameplay Screenshot Harvest

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harvest:
    name: Repair game ${{ matrix.game_index }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        game_index: [8, 9, 20]

    steps:
      - name: Check out isolated branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install harvesting dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade "yt-dlp[default,curl-cffi]" requests pillow opencv-python-headless imagehash numpy

      - name: Harvest repaired game
        id: harvest
        continue-on-error: true
        env:
          GAME_INDEX: ${{ matrix.game_index }}
          TARGET_PER_GAME: "15"
          SEARCH_RESULTS: "100"
          MAX_VIDEOS: "30"
        run: |
          set -o pipefail
          python tools/harvest_repair_queries.py 2>&1 | tee "harvest_${{ matrix.game_index }}.log"

      - name: Record game outcome
        if: always()
        run: |
          echo "Harvest outcome: ${{ steps.harvest.outcome }}" | tee -a "harvest_${{ matrix.game_index }}.log"
          find GAMEPLAY_REFERENCE_BANK -maxdepth 3 -type f 2>/dev/null | sort | tee -a "harvest_${{ matrix.game_index }}.log" || true

      - name: Upload repaired game result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repaired-game-${{ matrix.game_index }}
          path: |
            GAMEPLAY_REFERENCE_BANK/
            harvest_${{ matrix.game_index }}.log
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14

  package:
    name: Package repaired games
    if: always()
    needs: harvest
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download repaired artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: repaired-game-*
          path: repaired-parts
          merge-multiple: false

      - name: Remove candidate pools
        run: find repaired-parts -type d -name candidates -prune -exec rm -rf '{}' +

      - name: Upload repair bundle
        uses: actions/upload-artifact@v4
        with:
          name: AI_PROD_GAMEPLAY_REPAIRS
          path: repaired-parts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
