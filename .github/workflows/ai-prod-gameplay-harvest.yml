name: AI Prod Gameplay Screenshot Harvest

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harvest:
    name: Harvest game ${{ matrix.game_index }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        game_index: [1]

    steps:
      - name: Check out isolated branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install harvesting dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade "yt-dlp[default,curl-cffi]" requests pillow opencv-python-headless imagehash numpy

      - name: Harvest one game
        id: harvest
        continue-on-error: true
        env:
          GAME_INDEX: ${{ matrix.game_index }}
          TARGET_PER_GAME: "15"
          SEARCH_RESULTS: "60"
          MAX_VIDEOS: "24"
        run: |
          set -o pipefail
          python tools/harvest_youtube_auto_frames.py 2>&1 | tee "harvest_${{ matrix.game_index }}.log"

      - name: Record game outcome
        if: always()
        run: |
          echo "Harvest outcome: ${{ steps.harvest.outcome }}" | tee -a "harvest_${{ matrix.game_index }}.log"
          find GAMEPLAY_REFERENCE_BANK -maxdepth 3 -type f 2>/dev/null | sort | tee -a "harvest_${{ matrix.game_index }}.log" || true

      - name: Upload game result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-${{ matrix.game_index }}
          path: |
            GAMEPLAY_REFERENCE_BANK/
            harvest_${{ matrix.game_index }}.log
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14

  package:
    name: Package test reference bank
    if: always()
    needs: harvest
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out packager
        uses: actions/checkout@v4

      - name: Download game artifact
        uses: actions/download-artifact@v4
        with:
          pattern: game-*
          path: parts
          merge-multiple: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packaging dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Assemble test ZIP
        run: python tools/package_game_harvests.py parts FINAL_REFERENCE_BANK | tee package.log

      - name: Upload test reference bank
        uses: actions/upload-artifact@v4
        with:
          name: AI_PROD_GAMEPLAY_REFERENCE_BANK
          path: |
            AI_PROD_GAMEPLAY_REFERENCE_BANK.zip
            FINAL_REFERENCE_BANK/GAMEPLAY_REFERENCE_BANK/
            package.log
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
