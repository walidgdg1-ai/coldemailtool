name: AI Prod Gameplay Screenshot Harvest

on:
  schedule:
    - cron: "19 14 24 7 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-prod-scheduled-gallery-harvest
  cancel-in-progress: false

jobs:
  harvest:
    name: HD trusted-gallery 31-game harvest
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Stop if this annual trigger already completed
        id: guard
        run: |
          if [ -f HD_SCHEDULED_GALLERY_RESULT.json ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install harvesting dependencies
        if: steps.guard.outputs.skip != 'true'
        run: |
          python -m pip install --disable-pip-version-check requests beautifulsoup4 pillow opencv-python-headless imagehash numpy

      - name: Harvest 15 additional HD gameplay screenshots for all 31 games
        if: steps.guard.outputs.skip != 'true'
        id: harvest
        continue-on-error: true
        env:
          TARGET_PER_GAME: "15"
          MIN_WIDTH: "960"
          MIN_HEIGHT: "540"
        run: |
          set -o pipefail
          python tools/run_hd_page_crawl.py 2>&1 | tee hd_scheduled_harvest.log

      - name: Build package and result pointer
        if: steps.guard.outputs.skip != 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          summary_path = Path('HD_PARALLEL_GALLERY_SUMMARY.json')
          if summary_path.exists():
              summary = json.loads(summary_path.read_text(encoding='utf-8'))
          else:
              summary = {'completed_games': 0, 'games_with_any_images': 0, 'total_selected_images': 0, 'games': []}
          pointer = {
              'run_id': '${{ github.run_id }}',
              'artifact_name': 'ai-prod-hd-extra-31-games-final',
              **summary,
          }
          Path('HD_SCHEDULED_GALLERY_RESULT.json').write_text(json.dumps(pointer, indent=2), encoding='utf-8')
          print(json.dumps(pointer, indent=2))
          PY
          zip -0 -r AI_PROD_HD_EXTRA_31_GAMES.zip HD_EXTRA_REFERENCE_BANK HD_PARALLEL_GALLERY_SUMMARY.json gallery_harvest_*.log hd_scheduled_harvest.log

      - name: Upload final combined artifact
        if: steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ai-prod-hd-extra-31-games-final
          path: |
            AI_PROD_HD_EXTRA_31_GAMES.zip
            HD_SCHEDULED_GALLERY_RESULT.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish result pointer
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HD_SCHEDULED_GALLERY_RESULT.json
          git commit -m "Publish scheduled gallery harvest result [skip ci]" || exit 0
          git push origin HEAD:main
