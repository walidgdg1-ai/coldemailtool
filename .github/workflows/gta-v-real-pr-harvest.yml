name: GTA V Real PR Harvest

on:
  pull_request:
    branches: [main]
    paths:
      - 'GTA_V_REAL_TRIGGER.txt'

permissions:
  contents: read
  actions: read

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests beautifulsoup4 pillow opencv-python-headless imagehash numpy
      - name: Harvest
        continue-on-error: true
        env:
          TARGET: '100'
        run: python tools/gta_v_real_screenshot_harvest.py 2>&1 | tee GTA_V_REAL_100_HARVEST.log
      - name: Ensure result
        if: always()
        run: |
          test -f GTA_V_REAL_100_RESULT.json || printf '{"requested":100,"selected":0,"status":"failed_before_result"}\n' > GTA_V_REAL_100_RESULT.json
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gta-v-real-100-screenshots-pr
          path: |
            GTA_V_REAL_100_SCREENSHOTS.zip
            GTA_V_REAL_100/CONTACT_SHEET_100.jpg
            GTA_V_REAL_100/sources.csv
            GTA_V_REAL_100/sources.json
            GTA_V_REAL_100/README.txt
            GTA_V_REAL_100_RESULT.json
            GTA_V_REAL_100_HARVEST.log
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
