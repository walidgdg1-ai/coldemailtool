name: Probe BOAMP raw monthly format
on:
  push:
    branches: [tender-harvest-relay-20260812]
    paths: ['.github/workflows/france-format-probe.yml']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download one raw month
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir raw && cd raw
          gh release download tender-raw-france-v1 --pattern 'boamp_2024-01.csv' --clobber
          ls -lh
      - name: Inspect exact records and dialect
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv,json,collections
          p=Path('raw/boamp_2024-01.csv')
          b=p.read_bytes()[:100000]
          enc='utf-8-sig'
          try:text=b.decode(enc)
          except:text=b.decode('latin1');enc='latin1'
          lines=text.splitlines()
          dialects={}
          for delim in (',',';','\t','|'):
            vals=[]
            for ln in lines[:20]:
              try: vals.append(len(next(csv.reader([ln],delimiter=delim))))
              except: vals.append(-1)
            dialects[repr(delim)]=vals
          # Use csv.Sniffer too, but never trust it alone.
          sniff=None
          try:
            d=csv.Sniffer().sniff(text[:20000],delimiters=',;\t|')
            sniff={'delimiter':d.delimiter,'quotechar':d.quotechar,'doublequote':d.doublequote}
          except Exception as e: sniff={'error':repr(e)}
          sample_rows={}
          for delim in (',',';','\t','|'):
            try:
              r=csv.reader(lines[:10],delimiter=delim)
              sample_rows[repr(delim)]=[row[:20] for row in list(r)[:5]]
            except Exception as e: sample_rows[repr(delim)]={'error':repr(e)}
          summary={'file':p.name,'bytes':p.stat().st_size,'encoding':enc,'first_bytes_repr':repr(b[:1000]),'first_lines':[ln[:8000] for ln in lines[:8]],'dialect_field_counts':dialects,'sniffer':sniff,'sample_rows':sample_rows}
          Path('tender_pipeline').mkdir(exist_ok=True)
          Path('tender_pipeline/france_format_probe.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2)[:30000])
          PY
      - name: Commit probe summary
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tender_pipeline/france_format_probe.json
          git commit -m 'Record BOAMP raw format probe' || exit 0
          git pull --rebase origin tender-harvest-relay-20260812
          git push origin HEAD:tender-harvest-relay-20260812
