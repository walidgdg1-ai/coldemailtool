name: Validate Belgium public procurement search schema

on:
  push:
    branches: [tender-harvest-relay-20260812]
    paths: ['.github/workflows/belgium-public-search-schema-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install anonymous browser
        run: |
          python -m pip install --disable-pip-version-check -q playwright
          python -m playwright install --with-deps chromium >/dev/null
      - name: Inspect publication-date public picker
        run: |
          python - <<'PY'
          import asyncio,json
          from playwright.async_api import async_playwright
          API='/api/sea/search/publications'
          async def main():
            async with async_playwright() as p:
              browser=await p.chromium.launch(headless=True)
              page=await browser.new_page(locale='en-GB',viewport={'width':1440,'height':1400})
              async with page.expect_response(lambda r: API in r.url.lower(),timeout=90000) as first_info:
                await page.goto('https://www.publicprocurement.be/bda',wait_until='domcontentloaded',timeout=90000)
              first=await first_info.value
              assert first.status==200,first.status
              await page.wait_for_timeout(1500)
              field=page.locator('input').nth(6)
              print('VALUE_BEFORE',repr(await field.input_value()))
              await field.click()
              await page.wait_for_timeout(800)
              print('VALUE_AFTER_CLICK',repr(await field.input_value()))
              dialogs=page.locator('[role="dialog"]')
              print('DIALOG_COUNT',await dialogs.count())
              if await dialogs.count():
                print('DIALOG_TEXT',repr((await dialogs.last.inner_text())[:8000]))
                print('DIALOG_BUTTONS',json.dumps(await dialogs.last.locator('button').all_inner_texts(),ensure_ascii=False))
              else:
                visible=[]
                for i in range(await page.locator('button').count()):
                  b=page.locator('button').nth(i)
                  if await b.is_visible():
                    t=(await b.inner_text()).strip()
                    aria=await b.get_attribute('aria-label')
                    if t or aria: visible.append({'i':i,'text':t,'aria':aria})
                print('VISIBLE_BUTTONS',json.dumps(visible[-80:],ensure_ascii=False))
              await browser.close()
          asyncio.run(main())
          PY
