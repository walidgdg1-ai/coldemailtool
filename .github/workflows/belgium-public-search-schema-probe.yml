name: Validate Belgium public procurement search schema

on:
  push:
    branches: [tender-harvest-relay-20260812]
    paths: ['.github/workflows/belgium-public-search-schema-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install anonymous browser
        run: |
          python -m pip install --disable-pip-version-check -q playwright
          python -m playwright install --with-deps chromium >/dev/null
      - name: Map publication-date inputs with public Playwright locators
        run: |
          python - <<'PY'
          import asyncio,json
          from playwright.async_api import async_playwright
          API='/api/sea/search/publications'
          async def main():
            async with async_playwright() as p:
              browser=await p.chromium.launch(headless=True)
              page=await browser.new_page(locale='en-GB',viewport={'width':1440,'height':1400})
              async with page.expect_response(lambda r: API in r.url.lower(),timeout=90000) as first_info:
                await page.goto('https://www.publicprocurement.be/bda',wait_until='domcontentloaded',timeout=90000)
              first=await first_info.value
              assert first.status==200,first.status
              await page.wait_for_timeout(2000)
              all_inputs=page.locator('input')
              label=page.get_by_text('Publication date',exact=True).first
              assert await label.count(), 'Publication date text not found'
              found=[]
              parent=label
              for depth in range(1,6):
                parent=parent.locator('..')
                local=parent.locator('input')
                if await local.count():
                  for j in range(await local.count()):
                    target=local.nth(j)
                    index=-1
                    tid=await target.get_attribute('id')
                    for k in range(await all_inputs.count()):
                      if tid and await all_inputs.nth(k).get_attribute('id')==tid:
                        index=k;break
                    found.append({'depth':depth,'index':index,'id':tid,'type':await target.get_attribute('type'),'placeholder':await target.get_attribute('placeholder'),'aria':await target.get_attribute('aria-label')})
                  break
              print('PUBLICATION_DATE_INPUTS',json.dumps(found,ensure_ascii=False))
              assert found,found
              await browser.close()
          asyncio.run(main())
          PY
