name: Smoke Belgium monthly public BDA harvest

on:
  push:
    branches: [tender-harvest-relay-20260812]
    paths:
      - '.github/workflows/belgium-public-search-schema-probe.yml'
      - 'tools/belgium_public_month_harvest.py'
  workflow_dispatch:

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tender-harvest-relay-20260812
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install anonymous browser
        run: |
          python -m pip install --disable-pip-version-check -q playwright
          python -m playwright install --with-deps chromium >/dev/null
      - name: Harvest August 2023 through BOSA public month filter
        run: |
          python tools/belgium_public_month_harvest.py --month 2023-08 --out raw/belgium-month-smoke
      - name: Validate smoke manifest
        run: |
          python - <<'PY'
          import json
          q=json.load(open('raw/belgium-month-smoke/belgium-bda-2023-08.manifest.json'))
          print(json.dumps(q,indent=2))
          assert q['status']=='PASS',q
          assert q['publicationDateFrom']=='2023-08-01',q
          assert q['publicationDateTo_exclusive']=='2023-09-01',q
          assert q['out_of_window_rows']==0,q
          assert q['rows']>0 and q['pages']>0,q
          print('BELGIUM_MONTH_SMOKE_PASS',q['pages'],q['rows'],q['observed_min_date'],q['observed_max_date'])
          PY
      - name: Persist smoke evidence
        if: always()
        run: |
          set -euo pipefail
          TAG='tender-belgium-month-shard-smoke-v1'
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title 'Belgium BDA monthly shard smoke v1' --notes 'Anonymous public BOSA UI month-filter smoke for August 2023. No auth state persisted.' --target tender-harvest-relay-20260812
          fi
          find raw/belgium-month-smoke -maxdepth 1 -type f -print0 | while IFS= read -r -d '' f; do gh release upload "$TAG" "$f" --clobber; done
