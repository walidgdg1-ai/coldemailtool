name: Validate Belgium public procurement search schema

on:
  push:
    branches: [tender-harvest-relay-20260812]
    paths: ['.github/workflows/belgium-public-search-schema-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install anonymous browser
        run: |
          python -m pip install --disable-pip-version-check -q playwright
          python -m playwright install --with-deps chromium >/dev/null
      - name: Capture app-generated publication-date range payload
        run: |
          python - <<'PY'
          import asyncio,json
          from playwright.async_api import async_playwright
          API='/api/sea/search/publications'
          async def main():
            async with async_playwright() as p:
              browser=await p.chromium.launch(headless=True)
              page=await browser.new_page(locale='en-GB',viewport={'width':1440,'height':1400})
              requests=[]
              def on_request(req):
                if API in req.url.lower(): requests.append(req.post_data)
              page.on('request',on_request)
              async with page.expect_response(lambda r: API in r.url.lower(),timeout=90000) as first_info:
                await page.goto('https://www.publicprocurement.be/bda',wait_until='domcontentloaded',timeout=90000)
              first=await first_info.value
              assert first.status==200,first.status
              await page.wait_for_timeout(1200)
              field=page.locator('input').nth(6)
              await field.click()
              dialog=page.locator('[role="dialog"]').last
              assert await dialog.count(), 'date dialog not found'
              one=dialog.get_by_role('button',name='1',exact=True)
              two=dialog.get_by_role('button',name='2',exact=True)
              assert await one.count() and await two.count(), 'August day buttons not found'
              await one.click()
              await two.click()
              before=len(requests)
              async with page.expect_response(lambda r: API in r.url.lower(),timeout=30000) as filtered_info:
                await dialog.get_by_role('button',name='OK',exact=True).click()
              filtered=await filtered_info.value
              assert filtered.status==200,filtered.status
              await page.wait_for_timeout(300)
              print('FIELD_VALUE',repr(await field.input_value()))
              print('REQUEST_COUNT_BEFORE_OK',before,'AFTER',len(requests))
              print('APP_GENERATED_FILTER_BODY',requests[-1] if requests else None)
              body=await filtered.json(); pubs=body.get('publications') or []
              dates=[x.get('publicationDate') for x in pubs if x.get('publicationDate')]
              print('FILTERED_RESULT_COUNT',len(pubs),'NEWEST',max(dates) if dates else None,'OLDEST',min(dates) if dates else None)
              assert requests and 'page' in (requests[-1] or ''),requests
              await browser.close()
          asyncio.run(main())
          PY
