name: Validate Belgium public procurement search schema

on:
  push:
    branches: [tender-harvest-relay-20260812]
    paths: ['.github/workflows/belgium-public-search-schema-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install anonymous browser
        run: |
          python -m pip install --disable-pip-version-check -q playwright
          python -m playwright install --with-deps chromium >/dev/null
      - name: Probe whether public UI pagination is addressable through URL state
        run: |
          python - <<'PY'
          import asyncio,re
          from playwright.async_api import async_playwright

          API='/api/sea/search/publications'
          async def main():
            async with async_playwright() as p:
              browser=await p.chromium.launch(headless=True)
              page=await browser.new_page(locale='en-GB',viewport={'width':1440,'height':1100})
              requests=[]
              def on_req(req):
                if API in req.url.lower(): requests.append(req.post_data)
              page.on('request',on_req)
              await page.goto('https://www.publicprocurement.be/bda',wait_until='domcontentloaded',timeout=90000)
              await page.wait_for_timeout(5000)
              print('URL_INITIAL',page.url)
              p2=page.get_by_role('button',name=re.compile(r'^\s*2\s*$'))
              assert await p2.count() and await p2.first.is_visible()
              async with page.expect_response(lambda r: API in r.url.lower(),timeout=30000):
                await p2.first.click()
              await page.wait_for_timeout(1000)
              print('URL_AFTER_PAGE2',page.url)
              print('REQUEST_AFTER_PAGE2',requests[-1] if requests else None)
              # The public UI exposes the last page as a numbered pagination button.
              buttons=await page.locator('button').evaluate_all("els=>els.map((e,i)=>({i,text:(e.innerText||'').trim(),aria:e.getAttribute('aria-label'),disabled:e.disabled})).filter(x=>x.text)")
              nums=[]
              for b in buttons:
                t=b['text'].replace(',','').strip()
                if t.isdigit(): nums.append((int(t),b['text']))
              assert nums,buttons
              last_num,last_text=max(nums)
              print('LAST_VISIBLE_PAGE',last_num,last_text)
              last=page.get_by_role('button',name=re.compile(r'^\s*'+re.escape(last_text)+r'\s*$'))
              assert await last.count() and await last.first.is_visible()
              async with page.expect_response(lambda r: API in r.url.lower(),timeout=30000):
                await last.first.click()
              await page.wait_for_timeout(1000)
              print('URL_AFTER_LAST',page.url)
              print('REQUEST_AFTER_LAST',requests[-1] if requests else None)
              await browser.close()
          asyncio.run(main())
          PY
