name: Validate Belgium public procurement search schema

on:
  push:
    branches: [tender-harvest-relay-20260812]
    paths: ['.github/workflows/belgium-public-search-schema-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install anonymous browser
        run: |
          python -m pip install --disable-pip-version-check -q playwright
          python -m playwright install --with-deps chromium >/dev/null
      - name: Read public search-filter labels only
        run: |
          python - <<'PY'
          import asyncio,json
          from playwright.async_api import async_playwright
          API='/api/sea/search/publications'
          async def main():
            async with async_playwright() as p:
              browser=await p.chromium.launch(headless=True)
              page=await browser.new_page(locale='en-GB',viewport={'width':1440,'height':1400})
              async with page.expect_response(lambda r: API in r.url.lower(),timeout=90000) as first_info:
                await page.goto('https://www.publicprocurement.be/bda',wait_until='domcontentloaded',timeout=90000)
              first=await first_info.value
              assert first.status==200,first.status
              await page.wait_for_timeout(2500)
              print('LABELS',json.dumps(await page.locator('label').all_inner_texts(),ensure_ascii=False))
              rows=[]
              for i in range(await page.locator('input').count()):
                x=page.locator('input').nth(i)
                rows.append({'i':i,'type':await x.get_attribute('type'),'aria':await x.get_attribute('aria-label'),'placeholder':await x.get_attribute('placeholder')})
              print('INPUTS',json.dumps(rows,ensure_ascii=False))
              print('BUTTONS',json.dumps(await page.locator('button').all_inner_texts(),ensure_ascii=False))
              await browser.close()
          asyncio.run(main())
          PY
