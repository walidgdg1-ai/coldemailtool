name: Validate Belgium public procurement search schema

on:
  push:
    branches: [tender-harvest-relay-20260812]
    paths: ['.github/workflows/belgium-public-search-schema-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install anonymous browser
        run: |
          python -m pip install --disable-pip-version-check -q playwright
          python -m playwright install --with-deps chromium >/dev/null
      - name: Probe arbitrary pages using only the exact app-generated public payload shape
        run: |
          python - <<'PY'
          import asyncio,json
          from playwright.async_api import async_playwright

          TESTS=[
            {'includeOrganisationChildren':True,'page':2,'pageSize':25},
            {'includeOrganisationChildren':True,'page':250,'pageSize':25},
            {'includeOrganisationChildren':True,'page':1000,'pageSize':25},
          ]
          async def main():
            async with async_playwright() as p:
              browser=await p.chromium.launch(headless=True)
              page=await browser.new_page(locale='en-GB')
              await page.goto('https://www.publicprocurement.be/bda',wait_until='domcontentloaded',timeout=90000)
              await page.wait_for_timeout(3000)
              for i,payload in enumerate(TESTS,1):
                result=await page.evaluate("""async (payload) => {
                  const r=await fetch('/api/sea/search/publications',{
                    method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(payload)
                  });
                  const text=await r.text();
                  let body=null; try {body=JSON.parse(text)} catch(e) {body={_raw:text.slice(0,500)}}
                  return {status:r.status,body};
                }""",payload)
                o=result['body'];pubs=(o.get('publications') or []) if isinstance(o,dict) else []
                dates=[x.get('publicationDate') for x in pubs if x.get('publicationDate')]
                print('TEST',i,'STATUS',result['status'],'PAGE',payload['page'],'COUNT',len(pubs),'NEWEST',max(dates) if dates else None,'OLDEST',min(dates) if dates else None)
                assert result['status']==200,(i,result['status'],o)
                assert 0 < len(pubs) <= 25,(i,len(pubs))
              await browser.close()
            print('BELGIUM_ARBITRARY_PAGE_PUBLIC_PAYLOAD_PASS')
          asyncio.run(main())
          PY
