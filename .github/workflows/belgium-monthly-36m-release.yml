name: Belgium BDA monthly 36m release warehouse

on:
  push:
    branches: [tender-harvest-relay-20260812]
    paths: ['.github/workflows/belgium-monthly-36m-release.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  RAW_TAG: tender-raw-belgium-monthly-v2

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Prepare durable monthly release
        run: |
          set -euo pipefail
          if ! gh release view "$RAW_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RAW_TAG" --repo "$GITHUB_REPOSITORY" --title 'Belgium BDA monthly raw v2' --notes 'Anonymous public BOSA UI month shards for 2023-08 through 2026-07. Each month is persisted independently; aggregation removes BOSA inclusive upper-boundary overlap.' --target tender-harvest-relay-20260812
          fi

  harvest:
    needs: prepare-release
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        month:
          - '2023-08'
          - '2023-09'
          - '2023-10'
          - '2023-11'
          - '2023-12'
          - '2024-01'
          - '2024-02'
          - '2024-03'
          - '2024-04'
          - '2024-05'
          - '2024-06'
          - '2024-07'
          - '2024-08'
          - '2024-09'
          - '2024-10'
          - '2024-11'
          - '2024-12'
          - '2025-01'
          - '2025-02'
          - '2025-03'
          - '2025-04'
          - '2025-05'
          - '2025-06'
          - '2025-07'
          - '2025-08'
          - '2025-09'
          - '2025-10'
          - '2025-11'
          - '2025-12'
          - '2026-01'
          - '2026-02'
          - '2026-03'
          - '2026-04'
          - '2026-05'
          - '2026-06'
          - '2026-07'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      MONTH: ${{ matrix.month }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tender-harvest-relay-20260812
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Skip already persisted month
        id: existing
        run: |
          set -euo pipefail
          NAMES=$(gh release view "$RAW_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          if printf '%s\n' "$NAMES" | grep -qx "belgium-bda-$MONTH.jsonl.gz" && printf '%s\n' "$NAMES" | grep -qx "belgium-bda-$MONTH.manifest.json"; then
            echo 'skip=yes' >> "$GITHUB_OUTPUT"
            echo "BELGIUM_MONTH_ALREADY_PERSISTED=$MONTH"
          else
            echo 'skip=no' >> "$GITHUB_OUTPUT"
          fi
      - name: Install anonymous public-browser dependency
        if: steps.existing.outputs.skip != 'yes'
        run: |
          python -m pip install --disable-pip-version-check -q playwright
          python -m playwright install --with-deps chromium >/dev/null
      - name: Harvest one public BDA month
        if: steps.existing.outputs.skip != 'yes'
        run: |
          set -uo pipefail
          SUCCESS=no
          for ATTEMPT in 1 2 3; do
            rm -rf "raw/month-$MONTH"
            if python - <<'PY'
          import asyncio,json,os
          from pathlib import Path
          from types import SimpleNamespace
          from tools.belgium_public_month_harvest import main
          month=os.environ['MONTH'];out=f'raw/month-{month}'
          args=SimpleNamespace(month=month,out=out,delay_ms=125,retries=5)
          try:
              asyncio.run(main(args))
          except SystemExit as exc:
              if exc.code != 2:
                  raise
          p=Path(out)/f'belgium-bda-{month}.manifest.json';r=Path(out)/f'belgium-bda-{month}.jsonl.gz'
          if not p.exists() or not r.exists(): raise SystemExit('month raw/manifest missing')
          q=json.loads(p.read_text(encoding='utf-8'))
          assert q['publicationDateFrom']==month+'-01',q
          assert q['rows']>0 and q['pages']>0,q
          print('BELGIUM_MONTH_MATERIALIZED',month,q['pages'],q['rows'],q.get('observed_min_date'),q.get('observed_max_date'),q.get('out_of_window_rows'))
          PY
            then SUCCESS=yes; break; fi
            sleep $(( ATTEMPT * 10 ))
          done
          test "$SUCCESS" = yes
      - name: Persist monthly shard to release
        if: steps.existing.outputs.skip != 'yes'
        run: |
          set -euo pipefail
          gh release upload "$RAW_TAG" --repo "$GITHUB_REPOSITORY" "raw/month-$MONTH/belgium-bda-$MONTH.jsonl.gz" "raw/month-$MONTH/belgium-bda-$MONTH.manifest.json" --clobber
          NAMES=$(gh release view "$RAW_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          printf '%s\n' "$NAMES" | grep -qx "belgium-bda-$MONTH.jsonl.gz"
          printf '%s\n' "$NAMES" | grep -qx "belgium-bda-$MONTH.manifest.json"
          echo "BELGIUM_MONTH_RELEASE_READBACK_PASS=$MONTH"

  aggregate-normalize-publish:
    needs: harvest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tender-harvest-relay-20260812
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download all persisted monthly shards
        run: |
          mkdir -p raw/month-artifacts
          gh release download "$RAW_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'belgium-bda-*.jsonl.gz' --pattern 'belgium-bda-*.manifest.json' --dir raw/month-artifacts --clobber
      - name: Build exact 36-month raw corpus
        run: |
          python - <<'PY'
          import gzip,hashlib,json,re
          from pathlib import Path
          root=Path('raw/month-artifacts');out=Path('raw/belgium-exact');out.mkdir(parents=True,exist_ok=True)
          dest=out/'belgium-public-pages-monthly-00001-99999.jsonl.gz'
          seen=set();rows=0;excluded=0;dates=[];months=[];month_stats={}
          files=sorted(root.glob('belgium-bda-*.jsonl.gz'))
          if len(files)!=36: raise SystemExit(f'expected 36 month shards, got {len(files)}')
          with gzip.open(dest,'wt',encoding='utf-8',newline='') as w:
              for p in files:
                  m=re.fullmatch(r'belgium-bda-(\d{4}-\d{2})\.jsonl\.gz',p.name)
                  if not m: raise SystemExit(f'bad month filename {p.name}')
                  month=m.group(1);months.append(month);kept=0;drop=0
                  with gzip.open(p,'rt',encoding='utf-8') as f:
                      for line in f:
                          o=json.loads(line);pub=o.get('publication') or {};d=str(pub.get('publicationDate') or '')[:10]
                          if not d.startswith(month+'-'):
                              excluded+=1;drop+=1;continue
                          ws=str(pub.get('publicationWorkspaceId') or '')
                          key=ws or '|'.join([str(pub.get('procedureId') or ''),str(pub.get('referenceNumber') or ''),d,str(pub.get('noticeSubType') or '')])
                          if key in seen: continue
                          seen.add(key);rows+=1;kept+=1;dates.append(d)
                          w.write(json.dumps({'harvest_page':f"{month}:{o.get('page')}",'publication':pub},ensure_ascii=False,separators=(',',':'))+'\n')
                  month_stats[month]={'kept':kept,'boundary_or_outside_excluded':drop}
          if months[0]!='2023-08' or months[-1]!='2026-07' or len(set(months))!=36: raise SystemExit(months)
          if not dates or min(dates)<'2023-08-01' or max(dates)>'2026-07-31': raise SystemExit((min(dates),max(dates)))
          h=hashlib.sha256(dest.read_bytes()).hexdigest()
          manifest={'source':'Belgium e-Procurement Bulletin of Tenders public BDA','mode':'36_MONTH_UI_SHARDS_EXACT_WINDOW','window_start':'2023-08-01','window_end':'2026-07-31','months':36,'rows':rows,'unique_event_keys':len(seen),'boundary_or_outside_rows_excluded':excluded,'observed_min_date':min(dates),'observed_max_date':max(dates),'month_stats':month_stats,'file':dest.name,'bytes':dest.stat().st_size,'sha256':h,'status':'PASS'}
          (out/'belgium-public-checkpoint.json').write_text(json.dumps(manifest,indent=2),encoding='utf-8')
          print(json.dumps({k:v for k,v in manifest.items() if k!='month_stats'},indent=2))
          PY
      - name: Persist aggregate raw corpus
        run: |
          gh release upload "$RAW_TAG" --repo "$GITHUB_REPOSITORY" raw/belgium-exact/belgium-public-pages-monthly-00001-99999.jsonl.gz raw/belgium-exact/belgium-public-checkpoint.json --clobber
      - name: Apply exact observed BOSA metadata mapping
        run: python tools/patch_belgium_normalizer_runtime.py
      - name: Normalize Belgium notice-first warehouse
        run: |
          rm -rf normalized/belgium
          python tools/tender_normalize_belgium.py --raw-dir raw/belgium-exact --out normalized/belgium --start 2023-08-01 --end 2026-07-31
      - name: Validate canonical Belgium warehouse
        run: |
          python - <<'PY'
          import json
          q=json.load(open('normalized/belgium/data_quality.json'))
          print(json.dumps(q,indent=2))
          assert q['status']=='PASS',q
          assert q['canonical_tenders']>0 and q['publication_events']>0,q
          assert all(q['integrity'].values()),q
          PY
      - name: Publish canonical Belgium warehouse
        run: |
          set -euo pipefail
          TAG='tender-normalized-belgium-v1'
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title 'Public Tender Normalized — Belgium BDA v1' --notes 'Conservative notice-first Belgium public BDA warehouse, 2023-08-01 through 2026-07-31. Exact TED references only; no supplier/value award facts invented from search summaries.' --target tender-harvest-relay-20260812
          fi
          find normalized/belgium -maxdepth 1 -type f -print0 | while IFS= read -r -d '' f; do gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "$f" --clobber; done
      - name: Read back canonical release
        run: |
          set -euo pipefail
          rm -rf readback && mkdir readback
          gh release download tender-normalized-belgium-v1 --repo "$GITHUB_REPOSITORY" --pattern 'data_quality.json' --pattern 'run_manifest.json' --dir readback --clobber
          python - <<'PY'
          import json
          q=json.load(open('readback/data_quality.json'))
          assert q['status']=='PASS',q
          assert q['canonical_tenders']>0 and q['publication_events']>0,q
          print('BELGIUM_CANONICAL_READBACK_PASS',q['canonical_tenders'],q['publication_events'],q['unique_buyers'],q['exact_ted_reference_links'])
          PY
