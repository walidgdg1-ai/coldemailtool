name: USAspending monthly archive probe

on:
  push:
    branches: [tender-harvest-relay-20260812]
    paths:
      - '.github/workflows/usa-monthly-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q requests
      - run: python tools/usa_monthly_probe.py
