<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cold Email Tool</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f1117;--bg2:#1a1d27;--bg3:#242834;--border:#2e3346;--text:#e4e6ef;--text2:#9ca3b4;--primary:#6c5ce7;--primary-hover:#7c6ff7;--green:#00b894;--red:#e74c3c;--orange:#f39c12;--blue:#0984e3;--radius:8px;--shadow:0 2px 8px rgba(0,0,0,0.3)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}
a{color:var(--primary);text-decoration:none}a:hover{text-decoration:underline}
.app{display:flex;min-height:100vh}
.sidebar{width:220px;background:var(--bg2);border-right:1px solid var(--border);padding:20px 0;flex-shrink:0;position:fixed;top:0;left:0;bottom:0;overflow-y:auto;z-index:100}
.sidebar-logo{padding:0 20px 20px;font-size:18px;font-weight:700;color:var(--primary);border-bottom:1px solid var(--border);margin-bottom:10px}
.sidebar-nav{list-style:none}.sidebar-nav li{padding:10px 20px;cursor:pointer;transition:all .15s;font-size:14px;color:var(--text2);display:flex;align-items:center;gap:10px}
.sidebar-nav li:hover{background:var(--bg3);color:var(--text)}.sidebar-nav li.active{background:var(--bg3);color:var(--primary);border-right:3px solid var(--primary)}
.main{margin-left:220px;flex:1;padding:30px;max-width:1200px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:20px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px;margin-bottom:25px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:18px;text-align:center}
.stat-card .value{font-size:28px;font-weight:700;margin-bottom:4px}.stat-card .label{font-size:12px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
h1{font-size:22px;margin-bottom:20px;font-weight:600}h2{font-size:17px;margin-bottom:15px;font-weight:600}h3{font-size:15px;margin-bottom:10px;font-weight:600;color:var(--text2)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg3);color:var(--text);cursor:pointer;font-size:13px;font-family:inherit;transition:all .15s}
.btn:hover{border-color:var(--text2)}.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-hover)}
.btn-danger{background:var(--red);border-color:var(--red);color:#fff}.btn-danger:hover{opacity:.85}.btn-success{background:var(--green);border-color:var(--green);color:#fff}.btn-success:hover{opacity:.85}
.btn-sm{padding:5px 10px;font-size:12px}.btn-group{display:flex;gap:8px;flex-wrap:wrap}
.form-group{margin-bottom:15px}.form-group label{display:block;font-size:13px;font-weight:500;margin-bottom:5px;color:var(--text2)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:15px}
input[type="text"],input[type="number"],input[type="email"],select,textarea{width:100%;padding:9px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:13px;font-family:inherit;transition:border-color .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary)}textarea{resize:vertical;min-height:80px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}.toggle-row:last-child{border-bottom:none}
.toggle-label{font-size:13px}.toggle-desc{font-size:11px;color:var(--text2);margin-top:2px}
.switch{position:relative;width:42px;height:24px;flex-shrink:0}.switch input{opacity:0;width:0;height:0}
.switch .slider{position:absolute;inset:0;background:var(--bg3);border-radius:24px;cursor:pointer;transition:.2s;border:1px solid var(--border)}
.switch .slider::before{content:'';position:absolute;width:18px;height:18px;left:2px;bottom:2px;background:var(--text2);border-radius:50%;transition:.2s}
.switch input:checked+.slider{background:var(--primary);border-color:var(--primary)}.switch input:checked+.slider::before{transform:translateX(18px);background:#fff}
.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;background:var(--bg3);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);border-bottom:1px solid var(--border)}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}tr:hover td{background:rgba(108,92,231,.04)}
.badge{display:inline-block;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:600}
.badge-green{background:rgba(0,184,148,.15);color:var(--green)}.badge-red{background:rgba(231,76,60,.15);color:var(--red)}
.badge-orange{background:rgba(243,156,18,.15);color:var(--orange)}.badge-blue{background:rgba(9,132,227,.15);color:var(--blue)}
.badge-gray{background:rgba(156,163,180,.15);color:var(--text2)}.badge-purple{background:rgba(108,92,231,.15);color:var(--primary)}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;justify-content:center;align-items:flex-start;padding:40px 20px;overflow-y:auto}
.modal-overlay.open{display:flex}.modal{background:var(--bg2);border:1px solid var(--border);border-radius:12px;width:100%;max-width:720px;padding:25px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.modal-header h2{margin:0}
.modal-close{background:none;border:none;color:var(--text2);font-size:20px;cursor:pointer;padding:4px 8px}.modal-close:hover{color:var(--text)}
.step-block{border:1px solid var(--border);border-radius:var(--radius);padding:15px;margin-bottom:15px;background:var(--bg)}
.step-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.step-header h3{margin:0}
.variation-block{border:1px solid var(--border);border-radius:6px;padding:12px;margin-bottom:10px;margin-left:10px;background:var(--bg2)}
.variation-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.toast-container{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 18px;border-radius:var(--radius);font-size:13px;color:#fff;box-shadow:var(--shadow);animation:slideIn .3s ease;max-width:350px}
.toast-success{background:var(--green)}.toast-error{background:var(--red)}.toast-info{background:var(--blue)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.ab-bar-container{display:flex;gap:2px;height:28px;border-radius:4px;overflow:hidden;margin:8px 0}
.ab-bar{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff;min-width:30px}
.empty{text-align:center;padding:40px 20px;color:var(--text2)}.empty-icon{font-size:40px;margin-bottom:10px}
.flex{display:flex;align-items:center}.flex-between{display:flex;justify-content:space-between;align-items:center}
.gap-10{gap:10px}.gap-5{gap:5px}.mt-10{margin-top:10px}.mt-20{margin-top:20px}.mb-10{margin-bottom:10px}
.text-sm{font-size:12px}.text-muted{color:var(--text2)}.mono{font-family:'SF Mono','Fira Code',monospace;font-size:12px}
@media(max-width:768px){.sidebar{width:60px}.sidebar-logo{font-size:14px;padding:0 10px 15px;text-align:center}.sidebar-nav li span{display:none}.main{margin-left:60px;padding:15px}.form-row{grid-template-columns:1fr}.stats-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">
<nav class="sidebar">
<div class="sidebar-logo">ColdMail</div>
<ul class="sidebar-nav">
<li data-tab="dashboard" class="active" onclick="switchTab('dashboard')">📊 <span>Dashboard</span></li>
<li data-tab="campaigns" onclick="switchTab('campaigns')">🚀 <span>Campaigns</span></li>
<li data-tab="inboxes" onclick="switchTab('inboxes')">📬 <span>Inboxes</span></li>
</ul>
</nav>
<div class="main">
<div id="tab-dashboard" class="tab-content"><h1>Dashboard</h1><div class="stats-grid" id="dashboard-stats"></div><div class="card"><h2>Recent Activity</h2><div class="table-wrap"><table id="recent-logs-table"><thead><tr><th>Time</th><th>Campaign</th><th>To</th><th>Subject</th><th>Status</th></tr></thead><tbody></tbody></table></div></div></div>
<div id="tab-campaigns" class="tab-content" style="display:none"><div class="flex-between mb-10"><h1>Campaigns</h1><button class="btn btn-primary" onclick="openCampaignModal()">+ New Campaign</button></div><div id="campaigns-list"></div></div>
<div id="tab-campaign-detail" class="tab-content" style="display:none"><div class="flex gap-10 mb-10"><button class="btn btn-sm" onclick="switchTab('campaigns')">← Back</button><h1 id="campaign-detail-title" style="margin-bottom:0"></h1><span id="campaign-detail-badge"></span></div><div class="stats-grid" id="campaign-stats"></div><div class="flex gap-10 mb-10"><button class="btn btn-sm sub-tab active" data-sub="detail-steps" onclick="switchSubTab(this,'detail-steps')">Steps</button><button class="btn btn-sm sub-tab" data-sub="detail-leads" onclick="switchSubTab(this,'detail-leads')">Leads</button><button class="btn btn-sm sub-tab" data-sub="detail-ab" onclick="switchSubTab(this,'detail-ab')">A/B Stats</button><button class="btn btn-sm sub-tab" data-sub="detail-logs" onclick="switchSubTab(this,'detail-logs')">Logs</button></div><div id="detail-steps" class="sub-content"></div><div id="detail-leads" class="sub-content" style="display:none"></div><div id="detail-ab" class="sub-content" style="display:none"></div><div id="detail-logs" class="sub-content" style="display:none"></div></div>
<div id="tab-inboxes" class="tab-content" style="display:none"><div class="flex-between mb-10"><h1>Inboxes</h1><button class="btn btn-primary" onclick="openAddInboxModal()">+ Add Inbox</button></div><div id="inboxes-list"></div></div>
</div></div>
<div class="modal-overlay" id="modal-overlay" onclick="closeModalOnBackdrop(event)"><div class="modal" id="modal-content"></div></div>
<div class="toast-container" id="toast-container"></div>
<script>
const API='';
async function api(path,opts={}){const{method='GET',body,isFormData}=opts;const config={method,headers:{}};if(body&&!isFormData){config.headers['Content-Type']='application/json';config.body=JSON.stringify(body)}if(isFormData)config.body=body;const res=await fetch(API+path,config);if(!res.ok){const err=await res.json().catch(()=>({error:res.statusText}));throw new Error(err.error||'Request failed')}return res.json()}
function toast(msg,type='info'){const c=document.getElementById('toast-container');const el=document.createElement('div');el.className=`toast toast-${type}`;el.textContent=msg;c.appendChild(el);setTimeout(()=>{el.style.opacity='0';setTimeout(()=>el.remove(),300)},4000)}
let currentTab='dashboard',currentCampaignId=null;
function switchTab(tab){currentTab=tab;document.querySelectorAll('.tab-content').forEach(el=>el.style.display='none');document.querySelectorAll('.sidebar-nav li').forEach(el=>el.classList.remove('active'));const t=document.getElementById(`tab-${tab}`);if(t)t.style.display='block';const n=document.querySelector(`.sidebar-nav li[data-tab="${tab}"]`);if(n)n.classList.add('active');if(tab==='dashboard')loadDashboard();else if(tab==='campaigns')loadCampaigns();else if(tab==='inboxes')loadInboxes()}
function switchSubTab(btn,id){document.querySelectorAll('.sub-tab').forEach(el=>el.classList.remove('active'));document.querySelectorAll('.sub-content').forEach(el=>el.style.display='none');btn.classList.add('active');document.getElementById(id).style.display='block'}
function openModal(html){document.getElementById('modal-content').innerHTML=html;document.getElementById('modal-overlay').classList.add('open')}
function closeModal(){document.getElementById('modal-overlay').classList.remove('open')}
function closeModalOnBackdrop(e){if(e.target===document.getElementById('modal-overlay'))closeModal()}
function statusBadge(s){const m={active:'badge-green',completed:'badge-blue',draft:'badge-gray',paused:'badge-orange',failed:'badge-red',pending:'badge-gray',sent:'badge-green',sending:'badge-orange',replied:'badge-purple',unsubscribed:'badge-red'};return`<span class="badge ${m[s]||'badge-gray'}">${s}</span>`}
function timeAgo(d){if(!d)return'—';const diff=Date.now()-new Date(d+'Z').getTime();const m=Math.floor(diff/60000);if(m<1)return'just now';if(m<60)return`${m}m ago`;const h=Math.floor(m/60);if(h<24)return`${h}h ago`;return`${Math.floor(h/24)}d ago`}
function escHtml(s){if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML}
const TIMEZONES=['US/Eastern','US/Central','US/Mountain','US/Pacific','Europe/London','Europe/Paris','Europe/Berlin','Europe/Madrid','Europe/Rome','Europe/Amsterdam','Europe/Brussels','Europe/Zurich','Asia/Dubai','Asia/Kolkata','Asia/Singapore','Asia/Tokyo','Australia/Sydney','Pacific/Auckland','America/New_York','America/Chicago','America/Denver','America/Los_Angeles','America/Toronto','America/Sao_Paulo'].sort();
const VC={A:'#6c5ce7',B:'#0984e3',C:'#00b894',D:'#f39c12',E:'#e74c3c'};

async function loadDashboard(){try{const d=await api('/api/dashboard');document.getElementById('dashboard-stats').innerHTML=`<div class="stat-card"><div class="value">${d.sentToday||0}</div><div class="label">Sent Today</div></div><div class="stat-card"><div class="value">${d.sentWeek||0}</div><div class="label">This Week</div></div><div class="stat-card"><div class="value">${d.campaignStats?.active||0}</div><div class="label">Active Campaigns</div></div><div class="stat-card"><div class="value">${d.inboxStats?.total||0}</div><div class="label">Inboxes</div></div><div class="stat-card"><div class="value">${d.leadStats?.replied||0}</div><div class="label">Replies</div></div><div class="stat-card"><div class="value">${d.leadStats?.total||0}</div><div class="label">Total Leads</div></div>`;const tb=document.querySelector('#recent-logs-table tbody');if(!d.recentLogs||!d.recentLogs.length)tb.innerHTML='<tr><td colspan="5" class="empty">No activity yet</td></tr>';else tb.innerHTML=d.recentLogs.map(l=>`<tr><td class="text-muted text-sm">${timeAgo(l.sent_at)}</td><td>${escHtml(l.campaign_name)}</td><td class="mono">${escHtml(l.lead_email)}</td><td>${escHtml(l.subject)}</td><td>${statusBadge(l.status)}</td></tr>`).join('')}catch(e){toast(e.message,'error')}}

async function loadCampaigns(){try{const cs=await api('/api/campaigns');const el=document.getElementById('campaigns-list');if(!cs.length){el.innerHTML='<div class="card empty"><div class="empty-icon">🚀</div><p>No campaigns yet.</p></div>';return}el.innerHTML=`<div class="table-wrap card"><table><thead><tr><th>Name</th><th>Status</th><th>Leads</th><th>Done</th><th>Replied</th><th>Actions</th></tr></thead><tbody>${cs.map(c=>`<tr><td><a href="#" onclick="openCampaignDetail('${c.id}');return false"><strong>${escHtml(c.name)}</strong></a></td><td>${statusBadge(c.status)}</td><td>${c.stats?.total_leads||0}</td><td>${c.stats?.completed||0}</td><td>${c.stats?.replied||0}</td><td class="flex gap-5">${c.status==='draft'?`<button class="btn btn-success btn-sm" onclick="setCampaignStatus('${c.id}','active')">▶</button>`:''}${c.status==='active'?`<button class="btn btn-sm" style="border-color:var(--orange);color:var(--orange)" onclick="setCampaignStatus('${c.id}','paused')">⏸</button>`:''}${c.status==='paused'?`<button class="btn btn-success btn-sm" onclick="setCampaignStatus('${c.id}','active')">▶</button>`:''}<button class="btn btn-sm" onclick="openCampaignModal('${c.id}')">✏️</button><button class="btn btn-danger btn-sm" onclick="deleteCampaign('${c.id}')">🗑</button></td></tr>`).join('')}</tbody></table></div>`}catch(e){toast(e.message,'error')}}
async function setCampaignStatus(id,s){try{await api(`/api/campaigns/${id}`,{method:'PUT',body:{status:s}});toast(`Campaign ${s}`,'success');loadCampaigns()}catch(e){toast(e.message,'error')}}
async function deleteCampaign(id){if(!confirm('Delete campaign?'))return;try{await api(`/api/campaigns/${id}`,{method:'DELETE'});toast('Deleted','success');loadCampaigns()}catch(e){toast(e.message,'error')}}

let modalSteps=[];
async function openCampaignModal(eid){let c={name:'',timezone:'Europe/Paris',send_start_hour:8,send_end_hour:18,send_days:'1,2,3,4,5',track_opens:false,show_unsubscribe:false,unsubscribe_text:'Unsubscribe'};modalSteps=[{delay_days:0,variations:[{variant:'A',subject:'',body:'',weight:1}]}];if(eid){try{const d=await api(`/api/campaigns/${eid}`);c=d;if(d.steps&&d.steps.length)modalSteps=d.steps.map(s=>({delay_days:s.delay_days||0,variations:s.variations&&s.variations.length?s.variations.map(v=>({variant:v.variant,subject:v.subject,body:v.body,weight:v.weight||1})):[{variant:'A',subject:'',body:'',weight:1}]}))}catch(e){toast(e.message,'error');return}}
const tz=TIMEZONES.map(t=>`<option value="${t}" ${c.timezone===t?'selected':''}>${t}</option>`).join('');const sd=(c.send_days||'1,2,3,4,5').split(',').map(d=>parseInt(d));const dn=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];const dc=dn.map((n,i)=>`<label style="font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:3px;margin-right:8px"><input type="checkbox" class="modal-day-cb" value="${i}" ${sd.includes(i)?'checked':''}> ${n}</label>`).join('');
openModal(`<div class="modal-header"><h2>${eid?'Edit':'New'} Campaign</h2><button class="modal-close" onclick="closeModal()">✕</button></div><div class="form-group"><label>Name</label><input type="text" id="modal-name" value="${escHtml(c.name)}"></div><div class="form-row"><div class="form-group"><label>Timezone</label><select id="modal-tz">${tz}</select></div><div class="form-group"><label>Hours</label><div class="flex gap-5" style="align-items:center"><input type="number" id="modal-start-hour" min="0" max="23" value="${c.send_start_hour??8}" style="width:70px"><span>to</span><input type="number" id="modal-end-hour" min="0" max="23" value="${c.send_end_hour??18}" style="width:70px"></div></div></div><div class="form-group"><label>Days</label><div>${dc}</div></div><div class="card" style="margin-top:15px"><div class="toggle-row"><div><div class="toggle-label">Track Opens</div><div class="toggle-desc">Invisible pixel</div></div><label class="switch"><input type="checkbox" id="modal-track-opens" ${c.track_opens?'checked':''}><span class="slider"></span></label></div><div class="toggle-row"><div><div class="toggle-label">Unsubscribe Link</div><div class="toggle-desc">Footer link</div></div><label class="switch"><input type="checkbox" id="modal-show-unsub" ${c.show_unsubscribe?'checked':''} onchange="document.getElementById('unsub-text-group').style.display=this.checked?'block':'none'"><span class="slider"></span></label></div><div class="form-group mt-10" id="unsub-text-group" style="display:${c.show_unsubscribe?'block':'none'}"><label>Link Text</label><input type="text" id="modal-unsub-text" value="${escHtml(c.unsubscribe_text||'Unsubscribe')}"></div></div><h3 class="mt-20" style="color:var(--text)">Steps & Variations</h3><p class="text-sm text-muted mb-10">Up to 5 variations (A-E) per step.</p><div id="modal-steps-container"></div><div class="flex gap-10 mt-10"><button class="btn" onclick="modalAddStep()">+ Step</button></div><div class="flex-between mt-20"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="modalSaveCampaign('${eid||''}')">${eid?'Save':'Create'}</button></div>`);renderModalSteps()}

function renderModalSteps(){const el=document.getElementById('modal-steps-container');if(!el)return;el.innerHTML=modalSteps.map((s,si)=>`<div class="step-block"><div class="step-header"><h3>Step ${si+1} ${si>0?`<span class="text-sm text-muted">(${s.delay_days}d)</span>`:''}</h3><div class="flex gap-5">${si>0?`<label class="text-sm text-muted" style="display:flex;align-items:center;gap:4px">Delay:<input type="number" min="0" max="90" value="${s.delay_days}" style="width:55px" onchange="modalSteps[${si}].delay_days=parseInt(this.value)||0">d</label>`:''} ${modalSteps.length>1?`<button class="btn btn-danger btn-sm" onclick="modalRemoveStep(${si})">Remove</button>`:''}</div></div>${s.variations.map((v,vi)=>`<div class="variation-block"><div class="variation-header"><span class="badge" style="background:${VC[v.variant]||'#666'}22;color:${VC[v.variant]||'#666'}">Var ${v.variant}</span>${s.variations.length>1?`<div class="flex gap-5"><label class="text-sm text-muted" style="display:flex;align-items:center;gap:3px">W:<input type="number" min="1" max="10" value="${v.weight||1}" style="width:50px" onchange="modalSteps[${si}].variations[${vi}].weight=parseInt(this.value)||1"></label><button class="btn btn-danger btn-sm" onclick="modalRemoveVariation(${si},${vi})">✕</button></div>`:''}</div><div class="form-group"><label>Subject</label><input type="text" value="${escHtml(v.subject)}" onchange="modalSteps[${si}].variations[${vi}].subject=this.value"></div><div class="form-group"><label>Body</label><textarea rows="4" onchange="modalSteps[${si}].variations[${vi}].body=this.value">${escHtml(v.body)}</textarea></div></div>`).join('')}${s.variations.length<5?`<button class="btn btn-sm mt-10" onclick="modalAddVariation(${si})">+ Variation</button>`:''}</div>`).join('')}
function modalAddStep(){modalSteps.push({delay_days:3,variations:[{variant:'A',subject:'',body:'',weight:1}]});renderModalSteps()}
function modalRemoveStep(i){modalSteps.splice(i,1);renderModalSteps()}
function modalAddVariation(si){const ls=['A','B','C','D','E'];const u=modalSteps[si].variations.map(v=>v.variant);const n=ls.find(l=>!u.includes(l));if(!n)return;modalSteps[si].variations.push({variant:n,subject:'',body:'',weight:1});renderModalSteps()}
function modalRemoveVariation(si,vi){modalSteps[si].variations.splice(vi,1);renderModalSteps()}

async function modalSaveCampaign(eid){const name=document.getElementById('modal-name').value.trim();if(!name){toast('Name required','error');return}const tz=document.getElementById('modal-tz').value;const sh=parseInt(document.getElementById('modal-start-hour').value)||8;const eh=parseInt(document.getElementById('modal-end-hour').value)||18;if(sh>=eh){toast('Start < End','error');return}const dc=document.querySelectorAll('.modal-day-cb:checked');const sd=Array.from(dc).map(c=>c.value).join(',');if(!sd){toast('Select days','error');return}const to=document.getElementById('modal-track-opens').checked;const su=document.getElementById('modal-show-unsub').checked;const ut=document.getElementById('modal-unsub-text')?.value||'Unsubscribe';
document.querySelectorAll('.step-block').forEach((b,si)=>{b.querySelectorAll('.variation-block').forEach((vb,vi)=>{const s=vb.querySelector('input[type="text"]');const bd=vb.querySelector('textarea');if(s&&modalSteps[si]?.variations[vi])modalSteps[si].variations[vi].subject=s.value;if(bd&&modalSteps[si]?.variations[vi])modalSteps[si].variations[vi].body=bd.value})});
for(let i=0;i<modalSteps.length;i++)for(let j=0;j<modalSteps[i].variations.length;j++){const v=modalSteps[i].variations[j];if(!v.subject.trim()||!v.body.trim()){toast(`Step ${i+1} Var ${v.variant}: fill subject+body`,'error');return}}
const p={name,timezone:tz,send_start_hour:sh,send_end_hour:eh,send_days:sd,track_opens:to,show_unsubscribe:su,unsubscribe_text:ut,steps:modalSteps};
try{if(eid){await api(`/api/campaigns/${eid}`,{method:'PUT',body:p});toast('Updated!','success')}else{await api('/api/campaigns',{method:'POST',body:p});toast('Created!','success')}closeModal();loadCampaigns()}catch(e){toast(e.message,'error')}}

async function openCampaignDetail(id){currentCampaignId=id;document.querySelectorAll('.tab-content').forEach(e=>e.style.display='none');document.getElementById('tab-campaign-detail').style.display='block';document.querySelectorAll('.sidebar-nav li').forEach(e=>e.classList.remove('active'));try{const c=await api(`/api/campaigns/${id}`);document.getElementById('campaign-detail-title').textContent=c.name;document.getElementById('campaign-detail-badge').innerHTML=statusBadge(c.status);const s=c.stats||{};document.getElementById('campaign-stats').innerHTML=`<div class="stat-card"><div class="value">${s.total||0}</div><div class="label">Total</div></div><div class="stat-card"><div class="value">${s.pending||0}</div><div class="label">Pending</div></div><div class="stat-card"><div class="value">${s.active||0}</div><div class="label">Active</div></div><div class="stat-card"><div class="value">${s.completed||0}</div><div class="label">Done</div></div><div class="stat-card"><div class="value" style="color:var(--primary)">${s.replied||0}</div><div class="label">Replied</div></div><div class="stat-card"><div class="value" style="color:var(--red)">${s.failed||0}</div><div class="label">Failed</div></div>`;
const el=document.getElementById('detail-steps');if(!c.steps||!c.steps.length)el.innerHTML='<div class="card empty"><p>No steps</p></div>';else{const st=`<div class="card mb-10"><h3 style="color:var(--text)">Settings</h3><div class="flex gap-10 mt-10" style="flex-wrap:wrap"><span class="badge badge-blue">${c.timezone||'Europe/Paris'}</span><span class="badge badge-gray">${c.send_start_hour??8}h-${c.send_end_hour??18}h</span><span class="badge badge-gray">${(c.send_days||'1,2,3,4,5').split(',').map(d=>['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d]).join(',')}</span>${c.track_opens?'<span class="badge badge-green">Opens ON</span>':'<span class="badge badge-gray">Opens OFF</span>'}${c.show_unsubscribe?'<span class="badge badge-green">Unsub ON</span>':'<span class="badge badge-gray">Unsub OFF</span>'}</div></div>`;el.innerHTML=st+c.steps.map((step,i)=>`<div class="step-block"><div class="step-header"><h3>Step ${step.step_number} ${i>0?`<span class="text-muted text-sm">wait ${step.delay_days}d</span>`:''}</h3></div>${(step.variations||[]).map(v=>`<div class="variation-block"><div class="flex-between mb-10"><span class="badge" style="background:${VC[v.variant]||'#666'}22;color:${VC[v.variant]||'#666'}">Var ${v.variant}</span><span class="text-sm text-muted">w:${v.weight||1}</span></div><div class="text-sm"><b>Subject:</b> ${escHtml(v.subject)}</div><div class="text-sm mt-10" style="white-space:pre-wrap;color:var(--text2)">${escHtml(v.body)}</div></div>`).join('')}</div>`).join('')}
loadDetailLeads(id);loadDetailABStats(id);loadDetailLogs(id)}catch(e){toast(e.message,'error')}}

async function loadDetailLeads(cid){const el=document.getElementById('detail-leads');try{const ls=await api(`/api/campaigns/${cid}/leads`);el.innerHTML=`<div class="card"><div class="flex-between mb-10"><h2>Leads (${ls.length})</h2><div class="flex gap-5"><input type="file" id="csv-upload" accept=".csv" style="display:none" onchange="uploadCSV('${cid}')"><button class="btn btn-primary btn-sm" onclick="document.getElementById('csv-upload').click()">📁 Import</button></div></div>${!ls.length?'<div class="empty"><p>No leads. Import CSV.</p></div>':`<div class="table-wrap"><table><thead><tr><th>Email</th><th>Name</th><th>Company</th><th>Step</th><th>Status</th><th></th></tr></thead><tbody>${ls.map(l=>`<tr><td class="mono">${escHtml(l.email)}</td><td>${escHtml(l.first_name)} ${escHtml(l.last_name)}</td><td>${escHtml(l.company)}</td><td>${l.current_step}</td><td>${statusBadge(l.status)}${l.replied?' <span class="badge badge-purple">replied</span>':''}${l.unsubscribed?' <span class="badge badge-red">unsub</span>':''}</td><td class="flex gap-5">${!l.replied&&l.status!=='completed'?`<button class="btn btn-sm" style="border-color:var(--primary);color:var(--primary)" onclick="markReplied('${l.id}')">↩</button>`:''}<button class="btn btn-danger btn-sm" onclick="deleteLeadC('${cid}','${l.id}')">✕</button></td></tr>`).join('')}</tbody></table></div>`}</div>`}catch(e){el.innerHTML=`<div class="card text-muted">${escHtml(e.message)}</div>`}}
async function uploadCSV(cid){const f=document.getElementById('csv-upload');if(!f.files[0])return;const fd=new FormData();fd.append('file',f.files[0]);try{const r=await api(`/api/campaigns/${cid}/leads/import`,{method:'POST',body:fd,isFormData:true});let m=`Imported ${r.added}/${r.total}`;if(r.skipped){const s=r.skipped,p=[];if(s.duplicate)p.push(`${s.duplicate} dup`);if(s.invalid)p.push(`${s.invalid} invalid`);if(s.disposable)p.push(`${s.disposable} disposable`);if(s.unsubscribed)p.push(`${s.unsubscribed} unsub`);if(p.length)m+=` (skip: ${p.join(',')})`}toast(m,'success');loadDetailLeads(cid)}catch(e){toast(e.message,'error')}f.value=''}
async function markReplied(lid){if(!confirm('Mark replied? Stops follow-ups.'))return;try{const r=await api(`/api/leads/${lid}/replied`,{method:'POST'});toast(r.message,'success');if(currentCampaignId)loadDetailLeads(currentCampaignId)}catch(e){toast(e.message,'error')}}
async function deleteLeadC(cid,lid){if(!confirm('Delete lead?'))return;try{await api(`/api/campaigns/${cid}/leads/${lid}`,{method:'DELETE'});toast('Deleted','success');loadDetailLeads(cid)}catch(e){toast(e.message,'error')}}

async function loadDetailABStats(cid){const el=document.getElementById('detail-ab');try{const stats=await api(`/api/campaigns/${cid}/ab-stats`);if(!stats.length||stats.every(s=>!s.variations.length)){el.innerHTML='<div class="card empty"><p>No A/B data yet.</p></div>';return}el.innerHTML=stats.map(st=>{const vs=st.variations;if(!vs.length)return'';const ts=vs.reduce((s,v)=>s+v.sent,0);return`<div class="card"><h2>Step ${st.step_number}</h2><div class="table-wrap mt-10"><table><thead><tr><th>Var</th><th>Sent</th><th>Opens</th><th>Open%</th><th>Replies</th><th>Reply%</th></tr></thead><tbody>${vs.map(v=>`<tr><td><span class="badge" style="background:${VC[v.variant]||'#666'}22;color:${VC[v.variant]||'#666'}">${v.variant}</span></td><td>${v.sent}</td><td>${v.opens}</td><td>${vs.length>1&&v.open_rate===Math.max(...vs.map(x=>x.open_rate))?'🏆 ':''}${v.open_rate}%</td><td>${v.replies}</td><td>${vs.length>1&&v.reply_rate===Math.max(...vs.map(x=>x.reply_rate))&&v.reply_rate>0?'🏆 ':''}${v.reply_rate}%</td></tr>`).join('')}</tbody></table></div><div class="mt-10"><div class="ab-bar-container">${vs.map(v=>`<div class="ab-bar" style="width:${ts>0?Math.max(v.sent/ts*100,8):100/vs.length}%;background:${VC[v.variant]||'#666'}">${v.variant}:${v.open_rate}%</div>`).join('')}</div></div></div>`}).join('')}catch(e){el.innerHTML=`<div class="card text-muted">${escHtml(e.message)}</div>`}}

async function loadDetailLogs(cid){const el=document.getElementById('detail-logs');try{const logs=await api(`/api/campaigns/${cid}/logs`);if(!logs.length){el.innerHTML='<div class="card empty"><p>No logs.</p></div>';return}el.innerHTML=`<div class="card"><h2>Logs (${logs.length})</h2><div class="table-wrap mt-10"><table><thead><tr><th>Time</th><th>To</th><th>Step</th><th>Var</th><th>Via</th><th>Subject</th><th>Status</th></tr></thead><tbody>${logs.map(l=>`<tr><td class="text-sm text-muted">${timeAgo(l.sent_at)}</td><td class="mono">${escHtml(l.lead_email)}</td><td>${l.step_number}</td><td><span class="badge" style="background:${VC[l.variant]||'#666'}22;color:${VC[l.variant]||'#666'}">${l.variant||'A'}</span></td><td class="text-sm">${escHtml(l.inbox_email)}</td><td>${escHtml(l.subject)}</td><td>${statusBadge(l.status)}${l.opened?` <span class="badge badge-green">opened${l.open_count>1?' x'+l.open_count:''}</span>`:''}</td></tr>`).join('')}</tbody></table></div></div>`}catch(e){el.innerHTML=`<div class="card text-muted">${escHtml(e.message)}</div>`}}

async function loadInboxes(){try{const ib=await api('/api/inboxes');const el=document.getElementById('inboxes-list');if(!ib.length){el.innerHTML='<div class="card empty"><div class="empty-icon">📬</div><p>No inboxes.</p></div>';return}el.innerHTML=`<div class="table-wrap card"><table><thead><tr><th>Email</th><th>Name</th><th>Sent</th><th>Limit</th><th>Status</th><th></th></tr></thead><tbody>${ib.map(i=>{const p=i.daily_limit>0?Math.round(i.sent_today/i.daily_limit*100):0;return`<tr><td class="mono">${escHtml(i.email)}</td><td>${escHtml(i.name)}</td><td><div class="flex gap-5" style="align-items:center"><div style="flex:1;height:6px;background:var(--bg);border-radius:3px;min-width:60px"><div style="height:100%;width:${p}%;background:${p>=90?'var(--red)':p>=70?'var(--orange)':'var(--green)'};border-radius:3px"></div></div><span class="text-sm">${i.sent_today}/${i.daily_limit}</span></div></td><td><input type="number" min="1" max="200" value="${i.daily_limit}" style="width:65px" onchange="updateInbox('${i.id}',{daily_limit:parseInt(this.value)})"></td><td>${statusBadge(i.status)}</td><td class="flex gap-5">${i.status==='active'?`<button class="btn btn-sm" style="border-color:var(--orange);color:var(--orange)" onclick="updateInbox('${i.id}',{status:'paused'})">Pause</button>`:`<button class="btn btn-success btn-sm" onclick="updateInbox('${i.id}',{status:'active'})">Activate</button>`}<button class="btn btn-danger btn-sm" onclick="deleteInbox('${i.id}')">🗑</button></td></tr>`}).join('')}</tbody></table></div>`}catch(e){toast(e.message,'error')}}
function openAddInboxModal(){openModal(`<div class="modal-header"><h2>Add Gmail Inbox</h2><button class="modal-close" onclick="closeModal()">✕</button></div><p class="text-muted text-sm mb-10">Connect via OAuth2.</p><div class="form-group"><label>Sender Name</label><input type="text" id="inbox-name" placeholder="John from Acme"></div><div class="form-group"><label>Daily Limit</label><input type="number" id="inbox-limit" value="40" min="1" max="200"></div><div class="flex-between mt-20"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="connectInbox()">Connect →</button></div>`)}
async function connectInbox(){const n=document.getElementById('inbox-name').value.trim();const l=parseInt(document.getElementById('inbox-limit').value)||40;try{const{url}=await api('/api/inboxes/auth-url',{method:'POST',body:{name:n,daily_limit:l}});window.location.href=url}catch(e){toast(e.message,'error')}}
async function updateInbox(id,d){try{await api(`/api/inboxes/${id}`,{method:'PATCH',body:d});toast('Updated','success');loadInboxes()}catch(e){toast(e.message,'error')}}
async function deleteInbox(id){if(!confirm('Remove inbox?'))return;try{await api(`/api/inboxes/${id}`,{method:'DELETE'});toast('Removed','success');loadInboxes()}catch(e){toast(e.message,'error')}}

(function(){const p=new URLSearchParams(window.location.search);if(p.get('success'))toast(p.get('success'),'success');if(p.get('error'))toast(p.get('error'),'error');switchTab(p.get('tab')||'dashboard');if(p.toString())window.history.replaceState({},'','/')})();
</script>
</body>
</html>
